<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEG Dashboards, University & MoHE (Prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--crimson:#A92240;--pink:#E0457B;--gold:#E79E20;--teal:#005F73;--teal2:#0F8B8D;--red:#C8102E;--ink:#16181D;--text:#212529;--muted:#556070;--line:#e5e7eb;--bg:#f6f7f9;--green:#1f9d6b;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button{font-family:inherit;cursor:pointer}
.promo{background:var(--crimson);color:#fff;font-weight:600;font-size:13px;padding:8px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.promo .role{display:flex;gap:6px;background:rgba(255,255,255,.15);padding:3px;border-radius:999px}
.promo .role button{border:0;background:transparent;color:#fff;padding:5px 14px;border-radius:999px;font-weight:700;font-size:13px}
.promo .role button.on{background:#fff;color:var(--crimson)}
.app{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 36px)}
aside{background:var(--ink);color:#cbd0d8;padding:20px 13px;position:sticky;top:0;height:calc(100vh - 36px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand img{height:34px}
.wm{font-weight:800;font-size:26px;letter-spacing:-1px;background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;color:transparent;font-style:italic}
.brand small{display:block;color:#8b93a1;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.nav button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;color:#cbd0d8;padding:12px 14px;border-radius:10px;font-weight:600;font-size:14px;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:var(--crimson);color:#fff}
.nav .badge{background:#fff;color:var(--crimson);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:800}
.org{margin-top:18px;border-top:1px solid #2a2e36;padding-top:14px;font-size:12px;color:#8b93a1;padding-left:8px}
.org b{color:#fff;display:block;font-size:13px}
main{padding:24px 32px 70px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:26px;font-weight:800;margin:0;color:#1f2937}
.sub{color:var(--muted);margin-top:4px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:13px;background:var(--ink);color:#fff}
.btn.pri{background:var(--crimson)}
.btn.teal{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #cfd4dc}
.btn.danger{background:var(--red)}
.btn.ok{background:var(--green)}
.btn.sm{padding:7px 14px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{position:static;height:auto}}
.todo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.todo:first-of-type{border-top:0}
.stat{border-radius:var(--r);padding:16px 18px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);color:var(--text)}
.stat b{font-size:30px;display:block;font-weight:800;color:var(--ink)}.stat span{font-size:13px;color:var(--muted);font-weight:600}
h3{margin:0 0 12px;font-size:16px;font-weight:800}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
td{padding:13px 11px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
tr.click:hover{background:#fbf3f5;cursor:pointer}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.c-gray{background:#eceef2;color:#4b5563}.c-amber{background:#fdf0d5;color:#9a6200}.c-purple{background:#fdf0d5;color:#9a6200}.c-green{background:#dcf5ea;color:#13734d}.c-red{background:#fde4e8;color:#a3122a}.c-blue{background:#eceef2;color:#4b5563}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid #cfd4dc;background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px}
.tabs button.on{background:#f3f4f6;color:var(--ink);border-color:var(--ink)}
label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
label i{color:var(--ink);font-style:normal;font-weight:800}
input,select,textarea{width:100%;border:1px solid #cfd4dc;border-radius:11px;padding:11px 13px;min-height:42px;font:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #16181d33;border-color:var(--ink)}
.kflag{outline:2px solid #E79E20;outline-offset:4px;border-radius:8px;background:#fffaf0}.kflag-note{font-size:13px;font-weight:700;color:#9a6200;margin:4px 0 6px}
input::placeholder,textarea::placeholder{color:#b3b9c4}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;padding:0;margin:0;accent-color:var(--ink);flex:none}
.tgl{display:inline-flex;align-items:center;gap:8px;border:1px solid #cfd4dc;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;margin:0;cursor:pointer;background:#fff;white-space:nowrap}.tgl.on{background:#f3f4f6;border-color:var(--ink)}
.inl{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.pkg{display:grid;grid-template-columns:28px minmax(170px,1fr) 230px 160px 160px;gap:10px;align-items:center}.pk-h{margin:10px 0 4px}.pk-h label{margin:0;font-size:12px;color:var(--muted)}
.pkr{padding:8px 0;border-top:1px solid var(--line)}.pkr:first-of-type{border-top:0}.pkn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}.pka{display:flex;gap:2px;white-space:nowrap}.pkd{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 4px 34px}.pkg .pair{max-width:230px}
@media(max-width:900px){.pkg{grid-template-columns:26px 1fr}.pk-h{display:none}.pkg .pair,.pkg>input{grid-column:2}.pka{grid-column:2}}
.card>.sec:first-child{margin-top:0!important}
.aptool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.aptool input{flex:1;min-width:220px}.aptool select{width:auto}
.tabs button .cnt{display:inline-block;margin-left:7px;background:#eceef2;border-radius:999px;padding:0 8px;font-size:12px}.tabs button.on .cnt{background:var(--ink);color:#fff}
.wait{font-weight:700;font-size:13px}.wait.mid{color:#9a6200}
.bulkbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px}
tr.grow td{background:#f7f8fa}tr.sub td{background:#fcfcfd}tr.sub td:nth-child(2){padding-left:26px}
.chkrow{display:grid;grid-template-columns:1.1fr 1.3fr auto;gap:12px;align-items:center;padding:12px 10px;border-bottom:1px solid #f0f1f4;border-radius:8px}
.chkrow.flag{background:#fff6e0}.chkrow.nm{background:#fdecef}.chkrow.flash{outline:2px solid var(--ink)}
.docv{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.docv .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.docv .paper{margin:14px;border:1px solid #d6dae1;border-radius:6px;background:#fafbfc;padding:18px;min-height:210px;font-size:12px;color:#556070}.paper .ph{height:8px;background:#e5e7eb;border-radius:4px;margin:8px 0}
.kv2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px;margin:0}.kv2 dt{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}.kv2 dd{margin:3px 0 0;font-weight:600}
.crumbs{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#8a919c;margin:0 0 16px;flex-wrap:wrap;font-weight:600}.crumbs b{color:var(--ink)}.crumbs .sep{opacity:.5}.crumbs .dn{color:var(--green)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 22px}.facts small{display:block;font-size:11px;letter-spacing:.5px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px}.facts b{font-size:14px;font-weight:600}
.rq2{display:grid;grid-template-columns:26px 1fr auto;gap:14px;align-items:center;padding:14px 6px;border-bottom:1px solid #f0f1f4}.rq2:last-child{border-bottom:0}
.rq2.flag{background:#fff9ea;border-radius:10px;border-bottom-color:transparent}.rq2.nm{background:#fdf0f2;border-radius:10px;border-bottom-color:transparent}.rq2.flash{outline:2px solid var(--ink)}
.ico{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:1.5px solid #d6dae1;color:#fff}.ico.ok{background:var(--green);border-color:var(--green)}.ico.no{background:var(--red);border-color:var(--red)}.ico.wn{background:#E79E20;border-color:#E79E20}
.rq2t{font-weight:700;font-size:14px}.rq2t .meta{font-weight:600;font-size:11.5px;color:var(--muted);margin-left:8px}.rq2t .meta.upd{color:#fff;background:var(--ink);border-radius:999px;padding:1px 8px}
.rq2a{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:13px}.rq2a .ans{font-weight:600}.hintg{color:#13734d;font-size:12px}.hintw{color:#9a6200;font-size:12px;font-weight:600}
.seg2{display:inline-flex;border:1px solid #cfd4dc;border-radius:999px;overflow:hidden;background:#fff}.seg2 button{border:0;background:#fff;padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}.seg2 button+button{border-left:1px solid #cfd4dc}.seg2 button.met{background:var(--green);color:#fff}.seg2 button.not{background:var(--red);color:#fff}
.jl{border:1px solid #e3c37a;background:#fff;border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);margin:4px 4px 0 0}.jl:hover{background:#fff3d6}
.alert{background:#fff9ea;border:1px solid #f1d99a;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#6b4a00;line-height:1.5}
.pgl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}.pgl b{color:var(--ink)}.pgl .fl{color:#9a6200;font-weight:700}.bar.slim{height:6px;margin-bottom:14px}
.btn-lg{padding:14px;width:100%;font-size:14.5px}.row2{display:flex;gap:8px}.row2 .btn{flex:1}.btn.warnt{color:var(--red)}
.txtbtn{border:0;background:none;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;padding:6px}.txtbtn:hover{text-decoration:underline}
.optrow{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted);font-weight:500;margin:14px 0 0}.optrow input{width:auto;min-height:0;padding:0;accent-color:var(--ink)}
@media(max-width:800px){.facts{grid-template-columns:repeat(2,1fr)}}
.evl{margin:4px 0 2px}.evr{display:flex;gap:12px;padding:7px 0;position:relative}.evr .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ink);margin-top:6px}.evr:not(:last-child):before{content:"";position:absolute;left:4px;top:20px;bottom:-6px;width:2px;background:#e5e7eb}
.trs{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f1f4}.tic{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #d6dae1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}.trs.done .tic{background:var(--green);border-color:var(--green)}
.demo-b{background:#eef2ff;border:1px dashed #a5b4fc;border-radius:10px;padding:7px 12px;font-size:12.5px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.kpis .stat b{font-size:26px;display:block}.kpis .stat span{font-size:13px;color:var(--muted);font-weight:600}.kpis .stat .note{margin-top:4px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:1000px){.rg{grid-template-columns:1fr}}
.insr{padding:7px 0;border-bottom:1px solid #f0f1f4;font-size:13.5px}.insr:last-child{border-bottom:0}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.mini3 div{background:#f6f7f9;border-radius:10px;padding:10px 12px}.mini3 b{display:block;font-size:20px}.mini3 span{font-size:12px;color:var(--muted);font-weight:600}
.lgd{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted);font-weight:600}.lgd i,.dnl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.dnl{flex:1;min-width:190px}.dnl div{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #f0f1f4;font-size:13px}.dnl span{flex:1}.dnl small{color:var(--muted);width:36px;text-align:right}
.rsec{font-size:15px;font-weight:800;margin:26px 0 10px}.hb{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}.hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.hb b{text-align:right;font-weight:700}.hb .bar{height:12px}
.kgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:16px;align-items:start}.kdec{position:sticky;top:16px}
@media(max-width:1000px){.kgrid{grid-template-columns:1fr}.kdec{position:static}}
.f{margin-bottom:18px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed #cfd4dc;border-radius:14px;padding:26px;text-align:center;cursor:pointer;background:#fafbfc;margin:0}.drop:hover,.drop.over{border-color:var(--ink);background:#f3f4f6}.drop b{font-size:15px}.drop.sm{padding:14px;flex-direction:row;justify-content:center}
.lnk{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.chipset{display:flex;flex-wrap:wrap;gap:8px}.opt-chip{border:1px solid #cfd4dc;background:#fff;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;color:var(--text)}.opt-chip:hover{border-color:var(--ink)}.opt-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.err{color:var(--red);font-size:13px;font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:8px;border:1px solid #cfd4dc;border-radius:999px;padding:8px 15px;margin:0;font-weight:600;cursor:pointer}
.checks input{width:auto}
.checks label.on{background:#f3f4f6;border-color:var(--ink);color:var(--ink)}
.sec{border-left:4px solid var(--ink);padding-left:12px;margin:22px 0 12px;font-weight:800;font-size:16px}
.req{border:1px dashed #cfd4dc;border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfc}
.req .rr{display:grid;grid-template-columns:2fr 1.1fr 1.3fr auto auto;gap:8px;align-items:end}
.steps{display:flex;gap:0;margin:6px 0 18px;overflow:auto}
.step{flex:1;min-width:110px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);position:relative;padding-top:20px}
.step:before{content:"";position:absolute;top:4px;left:50%;width:12px;height:12px;border-radius:50%;background:#d6dae1;transform:translateX(-50%);z-index:1}
.step:after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:#d6dae1}
.step:first-child:after{display:none}
.step.done:before,.step.done:after{background:var(--green)}
.step.cur:before{background:var(--ink);box-shadow:0 0 0 4px #16181d22}.step.cur{color:var(--ink)}
.step.cur:after{background:var(--green)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:14px}.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:600}
.chk{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f1f4}
.seg{display:flex;gap:4px}.seg button{border:1px solid #cfd4dc;background:#fff;border-radius:999px;padding:7px 16px;font-size:12px;font-weight:700}
.seg button.met{background:var(--green);color:#fff;border-color:var(--green)}.seg button.not{background:var(--red);color:#fff;border-color:var(--red)}
.warn{background:#fff6e0;border:1px solid #f3d58e;color:#7a5200;border-radius:12px;padding:12px 15px;font-size:13.5px;margin:10px 0}
.info{background:#f3f4f6;border:1px solid #e5e7eb;color:#374151;border-radius:12px;padding:12px 15px;font-size:13.5px;margin:10px 0}
.bad{background:#fde4e8;border:1px solid #f5b5c0;color:#8a0f23;border-radius:12px;padding:12px 15px;font-size:13.5px;margin:10px 0}
.tl{border-left:2px solid #e5e7eb;margin-left:6px;padding-left:16px}.tl div{margin-bottom:12px;position:relative;font-size:13px}.tl div:before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--crimson)}.tl small{color:var(--muted);display:block}
.bar{height:10px;border-radius:999px;background:#eceef2;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.back{border:0;background:none;color:var(--ink);text-decoration:underline;font-weight:700;margin-bottom:10px;padding:0}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modal .box.big{width:min(980px,100%);padding:0}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-weight:600;font-size:13px;max-width:340px;box-shadow:0 8px 24px #0004}
.toast small{display:block;color:#f2c6d4;font-weight:600;margin-top:3px}
.bell{position:relative;border:1px solid #cfd4dc;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700}
.notif{position:absolute;right:0;top:44px;width:340px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px #0003;padding:12px;z-index:40;max-height:360px;overflow:auto;text-align:left}
.notif div{padding:8px 0;border-bottom:1px solid #f0f1f4;font-size:13px}.notif small{color:var(--muted);display:block}
.tag.on{background:var(--ink);color:#fff}
.tag{background:#f1f2f5;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;margin-right:4px;display:inline-block}
.right{display:flex;gap:8px;align-items:center;position:relative}
.note{font-size:12px;color:var(--muted)}
.cats td input{padding:6px 9px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mode{border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:#fff;text-align:left;font-family:inherit}
.mode b{display:block;font-size:14px;margin-bottom:2px}.mode span{font-size:12px;color:var(--muted);font-weight:500}
.mode.on{border-color:var(--ink);background:#f3f4f6}
.opt{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.opt .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}

y situations\n- Meaningful engagement  exchanges with the locals and fellow participants", "3", "DAYS", "BASIC ENGLISH", "USD 500 per participant\n\nPrice inclusive of:\nPrice inclusive of:\n- Material \n- Accommodation\n- Logistic (local area) \n-Trip visit entrance fees \n- Meals\n\n*Minimum of 15 participants", "None", "GENERAL PUBLIC\n(Kids: 10 years old and above)\n(Adult: 16 years old and above)", "TO BE DECIDED", "CERTIFICATES OF PARTICIPATION", "ASSOC. PROF. NORAZEAN BINTI ABDUL MALEK  "], ["HALAL BIZ_ GO GLOBAL, GROW BIG!", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "This program offers an insightful journey into the thriving global Halal industry, focusing on business, entrepreneurship, and market opportunities. The program explores the economic potential of the Halal market, the importance of Halal certification, and how businesses can leverage Malaysia’s world-class Halal ecosystem for growth through networking sessions with authorized agencies and industry experts. Participants will also experience Malaysia’s rich cultural heritage, gaining a holistic understanding of the Halal business landscape while exploring the nation’s traditions.", "Participants will engage in:\n\n1. Visiting Halal-certified factories to gain exposure to the Halal market and business practices.\n2. Gaining insights into Malaysia’s Halal certification processes directly from authoritative bodies such as JAKIM.\n3. Networking with successful Halal entrepreneurs, corporate leaders, and investors.\n4. Experiencing Malaysia’s rich culture and heritage to understand the roots of Halal business ethics.", "Upon completion, participants will be able to:\n\n- Understand the significant economic power of the Halal industry and how businesses can tap into this growing global market.\n- Gain practical knowledge of Malaysian Halal certification, compliance, and industry best practices.\n- Build valuable connections with industry experts and business leaders in Malaysia’s Halal market sector.\n- Understand the challenges and solutions related to the Halal market and industry.\n- Understand Malaysian culture and how it influences consumer behaviour.", "6", "DAYS", "BASIC ENGLISH", "USD 1750 per participant\n\nPrice inclusive of: \n- Accommodation - twin sharing\n- Meals (3 meals per day) \n- Airport Transfers and Ground Transportation \n- Insurance\n- Experiential learning\n- Field trips/ Cultural tours\n- Certificate\n  \n*Minimum of 15 participants", "NONE", "GENERAL PUBLIC                                                                                                                                                                                        ", "TO BE DECIDED", "CERTIFICATES OF PARTICIPATION", "ROSNI BINTI PUTEH "], ["GATEWAY SEMESTER_IMPERIA_BUSINESS ADMINISTRATION 1.0", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "Experience a transformative 1-semester Study Abroad Programme at Imperia, where you'll explore four dynamic Fundamental of Business Administration Modules. Through a blend of classroom learning, interactive activities, and cultural excursions, you'll gain valuable academic insights and firsthand exposure to Malaysia’s vibrant cities and rich multicultural heritage. Highlights include industry-relevant business courses and guided visits to iconic landmarks and cultural sites-an immersive journey of both professional and personal growth.", "Participants will engage in;\n\ni)Classroom Learning with lectures & tutorials on selected Fundamental of Business Administration Modules.\n\nii)Cultural and heritage tours featuring visits to iconic city and cultural landmarks such as the National Museum, Bukit Bintang, National Palace, Central Market (Pasar Seni), TRX, KLCC, Chinatown, National Mosque, Islamic Arts Museum, and Putrajaya. *Places to visit subject to change", "Upon completion of the programme participant will be able to:\n\n1.Understand the Accounting Fundamentals\n2.Broaden insight into managing people and organizations\n3.Gain in-depth knowledge of the principles of marketing \n4.Discover best practices in the Business Economics Service \n5.Experience Malaysia’s culture and heritage, deepening appreciation of local customs.", "6", "MONTHS", "BASIC ENGLISH", "USD 7,200 per participant\n\nPrice inclusive of:\n- Programme tuition fee \n- Registration & administration fee\n- Orientation\n- Lectures/tutorial/workshop\n- Airport transfer and Ground Transportation during Tour\n- Certificate \n*negotiable & subject to change\nNote: Minimum number of 10 participants", "NONE", "COLLEGE/UNIVERSITY STUDENTS\nOne must be fit for outdoor activities", "TBC", "CERTIFICATES OF COMPLETION", "ADLAN BIN RAHMAT"], ["INFORMATION TECHNOLOGY DIGITAL INNOVATION_AI_IOT_CYBER SECURITY AND CULTURAL IMMERSION PROGRAM", "SCIENCE AND TECHNOLOGY (SAT)", "Ready to boost your tech skills and see the world? This two-week international mobility program is your chance to dive into emerging technologies like IT, IoT, AI, and Cybersecurity while experiencing a rich cultural exchange. Whether you're a university student or a working professional, you'll learn through hands-on workshops, real-world industry visits, and global collaboration.\n\nOne major highlight is UCSI University's cutting-edge AI Lab. It’s loaded with Nvidia 4080 Super GPUs, giving you serious computing power for training deep learning models, analyzing big data, and exploring neural networks. It’s the perfect place to stay ahead in today’s fast-moving tech world.", "Participants will engage in:\n\n1. Practical lecture sessions and project-based learning in Information Technology, with a focus on Artificial Intelligence and Cybersecurity through specialized lab workshops.\n2. Immersive training within UCSI University’s advanced Cybersecurity Laboratory, designed to simulate real-world industry environments.\n3. Industry site visits related to Cybersecurity and digital asset protection, providing direct exposure to current practices and challenges.\n4. Individual and group projects and assessments centered on digital innovation, encompassing emerging technologies such as AI advancements, web development, and iOS application development.\n5. Cultural immersion experiences aimed at deepening participants’ understanding of Malaysia’s diverse heritage and societal context.", "Upon completion of this program, participants will be equipped with:\n\n1. Practical insights and advanced concepts in Information Technology (IT), the Internet of Things (IoT), Artificial Intelligence (AI), and Cybersecurity.\n2. Enhanced knowledge of deep learning models, the ability to conduct complex simulations, explore big data analytics, and optimize neural networks.\n3. In-depth understanding of real-time cybersecurity threat monitoring and real-world challenges such as ransomware, cryptojacking, data breaches, cloud security, IoT vulnerabilities, and distributed denial-of-service (DDoS) attacks.\n4. Exposure to regular workshops conducted at the lab by Palo Alto Networks, a global leader in firewall and cybersecurity solutions.\n5. Hands-on experience through interactive labs, expert-led seminars, and real-world case studies.", "2", "WEEKS", "BASIC ENGLISH", "USD1,200 - USD1,500 per particiipant\n\nPrice inclusive of: \n- Accomodation \n-Tuition/Training workshop fee\n- Transportation (Airport transfers / ground transport)\n- Museum/Park Tickets\n- Program Certificate\n\nNote : Minimum of 15 particpants", "NONE", "Public citizen\nUniversity Students", "UCSI NCR TRAVELS", "CERTIFICATE OF ACHIEVEMENT", "Stephen Corneilius"], ["TASTES AND TRADITIONS OF BORNEO", "FOOD, CULTURE AND HERITAGE (FCH)", "This programme offers an immersive edutourism experience in Borneo, combining academic learning with cultural exploration. Designed to blend interactive classroom sessions with real-world engagement, it allows participants to apply knowledge in authentic settings. Activities include cultural excursions, hands-on projects, and community interactions that highlight the traditions, stories, and heritage of the Sarawakian people. The programme aims to broaden participants’ perspectives, enhance personal and professional growth, and foster cultural appreciation. By connecting learning with local experiences, participants gain practical skills, global awareness, and inspiration to pursue new opportunities in their future endeavors.", "Participants will engage in:                                                                                                                                      \n• Interactive seminars, inspiring talks and mentorship sessions on sustainable tourism and storytelling techniques, blending theory with practical examples\n• Guided sightseeing tours of eco-friendly landmarks, heritage sites, and natural wonders\n• Hands-on engagement with local communities to learn traditions, conservation practices, and authentic stories\n• Participatory workshops on crafting impactful stories that highlight sustainability initiatives\n• Reflection sessions to consolidate learning and develop personal insights\n• Final presentation showcasing participants’ stories, multimedia projects, and experiential learning outcomes", "On successful completion of this programme, participants will be able to:                                                                                                                                                                      \n1. gain practical, hands-on knowledge of sustainable tourism and its real-world applications.\n2. understand the power of storytelling in creating memorable edu-tourism experiences.\n3. cultivate creative thinking and and produce engaging short-form travel content.\n4. develop foundational skills in crafting captivating digital content tailored to tourism audiences.", "1", "WEEKS", "INTERMEDIATE ENGLISH", "USD1000 per participant\nPrice inclusive of:\n•        course fee\n•        accommodation\n•        field trip \n•        airport transfers\n•        main meals\n\n*Price is subject to changes without prior notice\nNote: Minimum no. of 10 participants", "Eligible for credit transfer \n(Subject to the home university's requirement)", "GENERAL PUBLIC\nUNIVERSITY STUDENTS", "BRIGHTON TRAVEL & TOURS (890986-T),                                     SOON HUP TOWER, UNIT 15, LEVEL 2,\nJALAN MAJU, 98000 MIRI, SARAWAK, MALAYSIA                                                 EMAIL: sales@brightontt.com                     TEL.: +60 19-884 6186", "CERTIFICATION OF PARTICIPATION", "DR. HO JIE MIN"], ["ENGLISH ADVENTURE CAMP", "LANGUAGE AND COMMUNICATION (LAC)", "Set within Penang's renowned UNESCO World Heritage Site, this immersive program offers a unique opportunity to master English through direct engagement with living history and vibrant culture. Participants will strengthen their language proficiency by exploring George Town's iconic streets, engaging with local traditions, and uncovering the stories behind its legendary heritage. The curriculum blends interactive classroom sessions with real-world application through cultural excavations, team-building adventures, and creative challenges. Highlights include thematic English workshops, expert-led heritage tours, nature explorations in Penang's landscapes, and collaborative projects designed to build confidence and intercultural dialogue. By learning English in the context of a globally significant cultural destination, participants will not only achieve linguistic progress but also develop a deep appreciation for world heritage, global citizenship, and unforgettable memories in an inspiring international setting.", "Participants will enggage in:\n\n1. Collaborative team-building exercises\n2. Guided cultural visits to museums and historical sites\n3. Specialized workshops in Psychology, Multimedia, IT, and Business\n4. Hands-on science exploration and nature-based activities\n5. Individual and group assessment presentations", "Upon completion of the program, participants will be able to:\n• Strengthen English proficiency and confidence for use in diverse contexts.\n• Develop essential soft skills in public speaking, teamwork, and creative problem-solving.\n• Acquire technical and creative skills in digital storytelling and broadcast presentation.\n• Gain a global perspective and enhanced cultural intelligence.", "10\n(including arrival and departure date", "DAYS", "BASIC ENGLISH", "USD600 - 750 per participant\nPrice inclusive of:\n- Professional and Tuition Fees\n- Training Materials\n- Education and Cultural Trip\n- Certificate\n- Meals (3 times a day, optional on weekends)\n- Accommodation (Twin / Triple Sharing)\n- Airport transfer and ground transportion\n- Tour Guide\n\nMininum : 15 participants \nMaxinum : 50 participants\nWaiver for 1 participant for every 15 participants", "NONE", "GENERAL PUBLIC AGED BETWEEN 15 TO 23 YEARS OLD", "TBC", "CERTIFICATE OF COMPLETION", "TAN JIA HUEY"], ["CERTIFIED BUSINESS DATA ANALYST (MBOT)", "SCIENCE AND TECHNOLOGY (SAT)", "The 5-day Malaysia Board of Technologist accredited Certified Business Data Analyst program equips participants with essential business data analytics skills. It adopts a hands-on learning approach through real case studies, interactive lectures, and practical projects. Activities include data preparation, visualisation, reporting, and using tools like Microsoft Excel and Power BI. The program aims to develop analytical thinking and enable participants to convert data into actionable business insights.", "Participants will enggage in\n1.Real-world case studies, interactive lectures, \n2. Practical projects\n3.Explore key techniques in data preparation\n4.Analysis, visualization, and reporting.  \n5 Hands-on experience using tools such as Microsoft Excel and Power BI to transform data into actionable business insights\n5. Guided Tour around KL City", "Upon completion of this training program, participants will be able to:\n\n-Master Core Business Analytics Skills – Understand principles, lifecycle, and methods to collect, clean, and analyze business data.\n-Transform Data into Insights – Use statistical techniques and BI tools (e.g., Power BI) to develop dashboards, reports, and uncover trends to support strategic decisions.\n-Apply & Communicate Analytics in Practice – Implement analytics across business functions and present findings effectively through a capstone project and stakeholder presentations.", "5", "DAYS", "INTERMEDIATE ENGLISH", "USD 500 – USD 600 per participant\nPackage Inclusive of:\n-Accomodation\n-Meals (3 times per day)\n-Tuition & Program Delivery (all interactive lectures, practical projects, learning materials)\n-Airport Transfers & Ground Transport throughout the program\n\nMininum : 15 participant \nMaxinum : 50 participant\nWaiver for 1 participant for every 20 participants", "NONE", "GENERAL PUBLIC / STUDENTS / ETC", "TRAVELVAGO", "CERTIFICATE OF COMPLETION", "DR. RAHIZA"], ["GLOBAL PROFESSIONAL CORPORATE ENGLISH", "LANGUAGE AND COMMUNICATION (LAC)", "The 28-day Global Professional Corporate English EduTourism Program provides an intensive learning experience for professionals to strengthen their English communication for global business settings. The program is designed through interactive workshops, real-world simulations, industry networking, and immersive EduTourism exposure. Participants engage in business communication training, corporate visits, role-plays, cultural tours, and professional networking activities. The aim is to build advanced workplace English proficiency, enhance confidence in corporate communication, and provide meaningful insight into international business practices and Malaysian culture.", "Participants will enggage in:\n1.Business English writing, global corporate etiquette and presentation workshops\n2.3 Corporate visits to Malaysian companies and innovation hubs\n3.Negotiation and meeting communication role-plays\n4.Networking sessions with industry leaders\n5.Cultural and heritage tours for immersive language practice", "Upon completion of this training program, participants will be able to:\n\n-Achieve measurable improvements in business English proficiency, including writing, presentations, negotiations, and cross-cultural communication. \n-Develop essential soft skills such as confidence, teamwork, professional etiquette, and adaptability through real-world simulations and industry engagement. \n-Demonstrate the ability to communicate effectively in international corporate settings while applying language skills in authentic workplace and cultural contexts.", "8 -14", "DAYS", "INTERMEDIATE ENGLISH", "USD 1000 – USD 1700 per participant\nPackage inclusive of:\n-Accomodation\n-Meals (3 times per day)\n-Business English writing and presentation workshops\n-Corporate visits to Malaysian companies and innovation hubs\n-Negotiation and meeting sessions\n-Networking sessions \n-Cultural and heritage tours \nAirport Transfers & Ground Transport throughout the program\n\nMininum : 15 participant \nMaxinum : 50 participant\nWaiver for 1 participant for every 20 participants", "NONE", "GENERAL PUBLIC / STUDENTS / ETC", "TRAVELVAGO", "CERTIFICATE OF COMPLETION", "MR. VINCENT"], ["14-DAYS STUDY TOUR PROGRAMME", "FOOD, CULTURE AND HERITAGE (FCH)", "The Study Tour Programme offers an immersive introduction to diverse cultures and academic environments. Participants learn through lectures, hands-on workshops, and meaningful engagement with communities across the diversity of the country. Activities include campus tours, interactive sessions such as laser-cutting workshops, guided visits to historical sites, and cultural exchange events. Through these experiences, the programme aims to broaden global perspectives, encourage collaboration, and foster intercultural understanding among participants.", "Participants will engage in:\n - interactive workshops conducted by experienced lecturers from various backgrounds;\n - two-way exchange of perspectives;\n - local university learning environment;\n - an exchange of cultural insights with locals;\n - promoting mutual understanding and cross-cultural appreciation.\n-  traditional classes such as traditional music class, Malaysian Cultural Costume Experience and Malaysian traditional games such as galah panjang and baling selipar. \n - basic Malay language classes;\n - guided tour to interesting places and historical sites in Malaysia such as Malacca, Petronas Twin Tower, Genting Highlands, Batu Caves and Port Dickson. ", "Upon completion of the programme, participants will:\n\n • Gain a deeper understanding of diverse cultures and perspectives.\n • Enhance academic skills through participation in workshops and hands-on activities.\n • Improve communication and interpersonal skills by engaging with local communities and peers.\n • Experience personal growth by embracing new experiences.\n • Enhance critical thinking with a global perspective.", "14", "DAYS", "BASIC ENGLISH", "USD 800 per participant\nPrice inclusive of: \n • On campus accommodation (Quad sharing room)\n • Airport Transfers\n • Meals on campus (3 times a day)\n • Tuition fees and teaching materials \n • Ground transportation fees with tour guide.\n • Workshops\n \nNote: Minimum no. of 20 participants and the fee is subject to change, one waiver granted per 20 participants", "NONE", "HIGH SCHOOL STUDENTS/\nUNIVERSITY STUDENTS/\nUNIVERSITY STAFF", "TBC", "CERTIFICATE OF COMPLETION", "SHAKIRA MINHAD"], ["BRIDGING CULTURES, BUILDING CONFIDENCE", "LANGUAGE AND COMMUNICATION (LAC)", "This immersive study tour aims to provide participants with an immersive cultural experience while enhancing their academic and professional communication skills. The programme integrates cultural exploration with academic training to foster global awareness, confidence in public speaking, and critical thinking.", "Participants will enggage in:\n1. Upskilling workshops and lectures\n2. Academic writing, public speaking, and presentation skills training\n3. Internal assessments (both individual and group)\n4. Opportunities to connect with MILA students and communities\n5. Malaysian cultural immersion through excursions and field trips\n6. Experiental activities such as Malaysian fusion dance and local food appreciation", "Upon completion of the programme, participants will be able to:\n- Develop core communication skills, including structured academic writing, confident public speaking, and effective expression across various contexts.\n- Explore Malaysian culture and reflective learning practices, emphasizing cultural understanding, critical thinking, and personal growth.", "2", "WEEKS", "BASIC ENGLISH", "USD 2000 per participant\nPrice inclusive of:\n- Course Fee\n- Accommodation\n- Field Trips\n- Airport Transfers & Ground Transportation\n- Meals\n\nNote: minimum of 10 participants, price is subject to change without prior notice", "NONE", "GENERAL PUBLIC", "GLOBAL COMPASS TRAVEL SDN. BHD.", "CERTIFICATE OF PARTICIPATION", "MUHAMMAD SYAFIQ FARHAN BOO BIN OMAR BOO"], ["BIOCONNECT_EDUCATION, INDUSTRY AND CULTURE", "SCIENCE AND TECHNOLOGY (SAT)", "This programme provides participants with an immersive experience that combines academic learning, industry exposure, and cultural exploration. Through visits to biotechnology companies and research institutions, students gain real-world insights into current practices and innovations. Hands-on workshops and group activities enhance scientific communication, critical thinking, and teamwork skills. The programme also promotes interdisciplinary understanding by connecting biotechnology with social, ethical, and environmental contexts. By fostering global perspectives and professional development, this edutour equips students with the confidence, knowledge, and inspiration to pursue further studies or careers in biotechnology and contribute meaningfully to the advancement of the field.", "Participants will enggage in:\n1. basics of academic and scientific writing, presentation skills and visual communication, critical thinking in scientific discussions\n2. biotechnology-themed topics (e.g., GMOs, bioethics, sustainability), peer discussions and idea exchange\n3. group and individual practice with feedback, development of final group projects\n4. individual and group project presentations, reflective journaling or written assessment\n5. Malaysian cultural immersion through excursions and field trips\n6. an experiential activities such as Malaysian fusion dance and local food tasting", "Upon completion of the programme, participants will gain knowledge and practical skills in the following areas:\n- Development of scientific communication skills, covering academic writing and effective presentation techniques.\n- Exploration of real-world biotechnology applications, industry practices, and cross-cultural teamwork through practical engagement and experiential learning.", "2", "WEEKS", "BASIC ENGLISH", "USD 2000 per participant\n\nPrice inclusive of:\n- Course Fee\n- Accommodation\n- Field Trips\n- Airport Transfers & Ground Transportation\n- Meals\n\nNote: minimum of 10 participants, price is subject to change without prior notice\"", "NONE", "GENERAL PUBLIC", "GLOBAL COMPASS TRAVEL SDN. BHD.", "CERTIFICATE OF PARTICIPATION", "MUHAMMAD SYAFIQ FARHAN BOO BIN OMAR BOO"], ["GLOBAL ENTERPRISE EXPERIENCE_EXPLORING BUSINESS OPPORTUNITY IN MALAYSIA", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "This immersive programme offers participants the opportunity to engage with global entrepreneurship in an international context. Through cross-border collaboration, industry workshops, and experiential business activities, participants will explore innovation and enterprise in emerging markets. Highlights include teamwork with international peers, guided interactions with industry professionals, and real-world business challenges. By working in diverse entrepreneurial environments and multicultural teams, participants will develop insights into global business practices and strengthen skills in innovation, communication, and leadership essential for success in international ventures.", "Participants will engage in:\n• Start-up simulation challenges and business idea pitching\n• Innovation hackathons and design thinking workshops\n• Visits to companies, start-ups, and incubators\n• Guest lectures and masterclasses by entrepreneurs and industry experts\n• Networking sessions with local business leaders and alumni\n• Mentorship circles for guidance on strategy and career development\n• Global team projects with local and international peers\n• Cultural exchange evenings with shared traditions and cuisines\n• Intercultural communication workshops on teamwork and leadership\n• Pitch competitions judged by investors and academics\n• Leadership and negotiation skill-building sessions\n• Reflective journals or blogs connecting experiences to personal growth\n• Market visits and field research to understand local economies\n• Community enterprise projects with NGOs or social enterprises\n• Team-building adventures promoting trust, collaboration, and cross-cultural understanding", "Upon completion of the program, participants will be able to:\n• Develop an entrepreneurial mindset by identifying opportunities, generating innovative solutions, and adapting to dynamic business environments\n• Gain business development skills through practical experience in start-up creation, business planning, and pitching to investors or stakeholders\n• Build cross-cultural competence and confidence in collaborating with peers from diverse cultural, social, and professional backgrounds\n• Strengthen leadership and teamwork abilities by managing projects and motivating multicultural teams toward shared goals\n• Acquire global market insights into international business landscapes, emerging markets, and globalization challenges\n• Enhance strategic communication and negotiation skills for persuasive presentations and stakeholder engagement\n• Cultivate social and ethical awareness with appreciation for responsible and sustainable enterprise practices\n• Develop professional confidence to apply knowledge in real-world settings and excel as future global leaders", "7\n(April & September)", "DAYS", "BASIC ENGLISH", "7 DAYS - USD1200 per participant\nPrice inclusive of:\n- Course/ Workshops\n- Welcome & Farewell Ceremony\n- Welcome Dinner & Farewell Dinner\n- Airport transfers and ground transport\n- 3-star hotel accommodation with breakfast\n- Cultural activities\n- Experiential learning/ field trip\n- Cultural tours\n- insurance\n- Certificate\nMinimum no. of 10 participants", "NONE", "GENERAL PUBLIC AGED 18 YEARS AND ABOVE", "RELIANCE PREMIER TRAVEL SDN. BHD. 201901014906 (1324234-A)", "CERTIFICATE OF COMPLETION", "TAN KHENG POR"], ["SUMMER PROGRAMME IN TOURISM MANAGEMENT", "CULINARY ARTS AND HOSPITALITY (CAH)", "The programme introduces participants to various types of tourism as well as the knowledge in managing different tourism activities. Participants will get to explore tourism activities, workshops and cases on different tourist attractions.", "Participants will engage in:\n•vWorkshops on different tourist attractions\n• Field trips to famous tourist attractions                                                     \n• Talks by Experts on Culture, Tourism, and Management", "Upon completion of this programme, participants should be able to:\n1. Explore the diverse tourist attractions  in Malaysia.\n2. Apply Tourism Management skills and knowledge obtained through interactive sessions with experts from the Malaysian tourism industry.\n3. Reflect on the new and unfamiliar cultural experiences in Malaysia", "2", "WEEKS", "BASIC ENGLISH", "USD 2,100 per participant\n\nPrice inclusive of:\n- accommodation\n- experiential learning\n- welcome and farewell reception\n- cultural tours\n                                                                                             \nNote: Minimum no. of 20 participants", "NONE", "Taylor's University International Students\n", "TBC", "YES", "SHARINI JOANNE SAGADEVAN"], ["29 DAYS LIVING TEXT IN MALAYSIA", "FOOD, CULTURE AND HERITAGE (FCH)", "This programme features immersive experiences in from the city centre to outskirts of Kuala Lumpur, Malacca, Segamat and Kampar. From traditional arts and language exploration to leadership development and intercultural  exchange, this programmes offers dynamic blend of education and cultural discovery. Participants will gain valuable insights, lasting friendships and a deeper appreciation of Malaysia's multicultural heritage.", "Participants will engage in:\n\n1. Seminars / Classroom based workshop\n2. Hands-on Workshop (Batik Colouring , Henna and Kolam Workshop)\n3. Practical Workshop (Malaysia Delicacy Workshop)\n4. Focused Group Discussion & Presentations\n5. Malaysian Cultural Exposure (Traditional clothing, games and food)\n6. Industrial site visits (Durian Farm)\n7. Excursion: Batu Caves, Suria KLCC, Connaught Night Market, Thien Hou Temple, Malacca, Segamat, Ipoh and Kampar", "Upon completion of the programme, participants will be able to:\n- Understand the Malaysian cultures and customs\n- Learn basic Bahasa Melayu\n- Appreciate local hospitality and traditions\n- Enhance communication and interpersonal skills by communicating and speaking infront of crowds through Public Speaking Workshop\n- Enhance critical thinking and problem solving through teambuilding, 3D Printing in Geodesic Dome Construction, Spaghetti Challenge Workshop\n- Enhance leaderhsip and teamwork through teambuilding activities\n- Improve health awareness through wellness activities\n- Appreciate mother nature in exploring the longest limestone cave in Peninsula Malaysia, Gua Tempurung and Agarwood Plantation", "4", "WEEKS", "BASIC ENGLISH", "USD2,900 per participant\nPrice inclusive of: \n- Designated time airport transfers\n- Ground transport\n- Workshops\n- Experiential learning\n- Lunch (15)\n- Cultural tours\n- Excursions\n- Accommodation: 3 Star Hotel in Kuala Lumpur and Kampar - twin sharing \n- Accommodation : Hostel in Segamat\n- Programme Certificate\n\nMinimum: 25 participants\nWaiver for 1 chaperone for every 10 participants", "NONE", "GENERAL PUBLIC", "JETASIA (M) SDN BHD", "CERTIFICATE OF ATTENDANCE", "LEOW KAR JUN"], ["GLOBAL PROJECT BASED LEARNING ON ROBOTIC DESIGN", "SCIENCE AND TECHNOLOGY (SAT)", "The gPBL program advances Malaysia’s higher education goals by integrating experiential learning, industry collaboration and international exposure. Through project-based activities with National Instruments (NI) using LabVIEW and MyRIO, students engage with real engineering challenges while strengthening IR4.0 skills such as problem-solving, teamwork and communication. Collaboration with students from local and international universities enhances cross-cultural awareness and global readiness. By the end of the program, participants will be equipped with technical competence, global perspectives and industry-relevant skills.\"", "Participants will engage in:\n1.Orientation and campus introduction through a welcome briefing, UiTM tour, and ice-breaking activities.\n2.Technical workshops and hands-on robotics training using LEGO Mindstorms EV3, LabVIEW, and MyRIO for intelligent robot programming.\n3.Robot design and project development involving team-based construction, coding, troubleshooting, and mentor-guided problem-solving.\n4.Project-based learning and competition preparation through intensive robot testing, peer feedback, and final presentation rehearsals.\n5.Final competition and presentation showcase where teams demonstrate their robots, present findings, and receive academic evaluation.\n6.Cultural exchange and Penang heritage excursion exploring cultural landmarks and engaging in interactive cross-cultural activities.", "Upon completion of the programme, participants will be equipped with:\n1. Fundamental knowledge of robotics systems, including robot design, programming, and intelligent control using LEGO EV3, LabVIEW, and MyRIO.\n2. Practical hands-on experience in building, coding, testing, and troubleshooting robots to solve real-world technical challenges.\n3. Teamwork and project management skills developed through collaborative robot-building projects, peer feedback, and competition preparation.\n4. Effective communication and presentation abilities gained from project reporting, rehearsals, and final showcase evaluations.\n5. Broader cultural awareness and global understanding through interactive cultural exchange and exploration of Penang’s heritage.", "2", "WEEKS", "BASIC ENGLISH", "USD 1200 per participant\n\n Price inclusive of:\n1. Transportation\n2. Accommodation \n3. Meals (3 times per day)\n4. Cultural and heritage visit \n5. 1 night at Parkroyal Hotel, Penang (2D1N)\n6. Certificate\"", "NONE", "UNIVERSITY STUDENTS ", "TBC", "CERTIFICATE OF PARTICIPATION AND COMPLETION", "ASSOC. PROF. IR. DR. NOR AZLAN OTHMAN"], ["SUSTAINABLE ENTREPRENEURSHIP ", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "This comprehensive 1-week programme introduces participants to sustainable entrepreneurship within the Malaysian context. Through interactive lectures, field visits, and experiential learning, participants explore how innovation, sustainability, and business intersect to create economic and social impact. Designed to promote intellectual exchange and cross-cultural collaboration, the programme also provides valuable networking opportunities. The goal is, participants will understand Malaysia’s entrepreneurial ecosystem, including its policies, cultural factors, and market dynamics. They will gain insights into green business models, social entrepreneurship, the circular economy, and sustainable supply chains, equipping them with the knowledge and skills to apply entrepreneurial thinking to global sustainability challenges.", "Participants will engage in:\n1. Entrepreneurship Classes\n2. Campus Tour \n3. City Tour (Kuala Lumpur)\n4. Field Trips/Excursions \n5. Cultural Activities (Batik Painting, Chinese Calligraphy, Traditional Dances)", "Upon the completion of the program, the participants will.\n1.Have an understanding of the basic structure of the Malaysian entrepreneurship\n2.Be exposed to the real business practices and interact with players in the industries.", "7", "DAYS", "BASIC ENGLISH", "USD1,000 per articipant\n\nPrice inclusive of:\n- Tuition fee\n- Accommodation\n- Airport transfers and ground transport\n- Traditional and cultural activities\n- Experiential learning\n- Field trips\n- Cultural tours\n- Welcome and Farewell Ceremony", "NONE", "UNDERGRADUATE STUDENTS", "TBC", "CERTIFICATE OF COMPLETION", "ADI YUSRAN BIN MOHAMAD RADZI INTERNATIONAL STUDENT CENTRE (ISC)"], ["GENERATING ENTREPRENEURS NEXUS WITH AI", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "Join this groundbreaking international initiative that fuses specialized AI entrepreneurship training with a unique edutourism concept. Now open to the general public, the program operates within a dynamic quadruple helix ecosystem, offering a hands-on pathway to innovation. The journey involves visiting key tech hubs, pitching directly to global investors, and networking with international peers. This immersive experience aims to foster a new generation of AI-Preneurs, equipping them with essential global exposure and cross-cultural business acumen for success in the digital economy.", "Participants will engage in: \n1. Interactive Digital and AI Workshops. Participants receive intensive training on the latest digital tools and emerging AI technologies for entrepreneurship.\n2. Quadruple Helix Immersion. Engage in dedicated mentorship and networking sessions with experts from government, academia, industry, and the community.\n3. Global Edutourism Pitch. Participate in a structured journey to international tech hubs to deliver pitches to real investors, thereby gaining invaluable exposure and feedback.\n4. Cross Cultural Communication Coaching. Receive personalized guidance to hone verbal and nonverbal skills specifically for navigating diverse international business environments.", "\nUpon completion of the program, participants will be equipped with:\n- AIPreneurial acumen to gain practical knowledge in launching and managing AI-driven businesses, from ideation to market entry.\n- Cultural intelligence to work effectively and build rapport across different business cultures\n- Global networking to build a valuable, long-term network of international potential partners\n- Pitching skills to deliver high-impact, persuasive presentations to a global audience.\n", "1", "MONTHS", "BASIC ENGLISH", "USD3,000 - USD4,000 per participant\nPrice inclusive of:\n- Airport transfers and ground transport\n- Traditional and cultural activities\n- Experiential learning\n- Cultural tours\n- Program Certificate\n\nMininum no of participants: 10 participants \nMaxinum no of participants: 20 participants\nWaiver for 1 participant for every 15 participants", "NONE", "GENERAL PUBLIC\n", "TBC\n", "CERTIFICATE OF PARTICIPATION", "DR. FATIHAH BINTI MOHD"], ["LANGUAGE, CULTURE AND CULINARY IMMERSION IN MALAYSIA", "LANGUAGE AND COMMUNICATION (LAC)", "Discover Malaysia through an immersive “3-in-1” edutourism experience through the lens of Peninsula and Borneo - combining English language learning, cultural exploration, and culinary heritage. Participants will engage in interactive workshops, homestays, and real-life practice while exploring three vibrant destinations: Kuala Lumpur for its modern cityscape and historical landmarks, Petaling Jaya for authentic local living as well as Kota Kinabalu for indigenous traditions and jungle adventures. Highlights include cultural site visits, ethnic dance performances, Malaysian fashion design, food tasting, cooking demonstrations, and market tours as well as white water rafting. This program enhances communication skills, fosters intercultural understanding, and builds leadership through experiential learning, offering a unique blend of education, culture, and adventure.", "Participants will engage in :\n1. English language workshops and conversation practice\n2. Cultural immersion: visits to museums, historical landmarks, and ethnic villages as well as modern KL city excursion\n3. Culinary experiences: food tasting, cooking demonstrations, and local market tours as well as local fruit tasting\n4. Ethnic dance and music performances as well as \"Malaysian fashion design\" experience\n5. Homestay in local settings \n6. Group discussions and presentations\n7. Jungle trekking, white-water rafting and \"shopping-malls\" hopping excursions", "Upon completion of the program, participants will be able to:\n1. Improve English language proficiency through structured lessons and real-life practice\n2. Develop interpersonal and leadership skills through experiential learning\n3. Develop a global mindset through cross-cultural experiences insights into Malaysian ethnic and indigenous cultures\n4. Learn about traditional food preparation and its cultural significance", "7-21", "DAYS", "BASIC ENGLISH", "USD 2,100 – USD 3,300 per participant\nPrice inclusive of:\n1. Accommodation\n2. Meals (2 times per day)\n3. Ground Transportation and airport transfer)\n4.Certificate\n5. Welcome and Farewell Ceremony \n6. Academic tuition fees\n7. Cultural and culinary activities).\n\nMinimum: 15 participants, \nMaximum: 40 participants. \nWaiver for 1 participant for every 20 participants.", "NONE", "GENERAL PUBLIC AGED 18 YEARS AND ABOVE /UNIVERSITY STUDENTS", "TBC", "CERTIFICATE OF COMPLETION", "VANESSA FAYE GEORGE"], ["INNOVATING IN THE GIG ECONOMY_SKILLS FOR THE FUTURE", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "This program is designed to prepare participants with essential skills for success in the GIG economy. Cultural workshops will provide insights into local traditions and cultural diversity, while academic workshops cover key areas such as creative problem-solving, entrepreneurship, effective communication, digital marketing, and innovation. Participants will also learn how to turn ideas into actionable plans and present them with impact. The program includes cultural excursions to iconic destinations like Kuala Lumpur and Malacca, offering a unique blend of academic learning and immersive cultural experiences to help participants thrive in a rapidly changing global economy.", "Participants will engage in:\n- Two (2) Cultural Workshops\n- 20 Things You Should Know About Malaysia sharing session\n- Malaysian Traditional Games\n- Ten (10) Academic Workshops: Design Thinking, Being Enterprising – Goal Setting, Starting a business, Effective Communication in Pitching Ideas, Turning Idea into Reality, Presentation of Idea, Level up! Creating your own game, Social Media development, Web design and Power of prototype development to innovation\n- Two (2) Cultural Excursion\n- Day trip: Kuala Lumpur – A city with diverse culture (Malay,\nChinese and Indian)\nMalacca – UNESCO World Heritage Site", "Upon completion of the program, participants will be able to: \n1. Develop entrepreneurial and problem-solving skills crucial for success in the GIG economy.\n2. Enhance communication and presentation abilities for pitching ideas and driving innovation.\n3. Gain cultural awareness and global perspectives through immersive workshops and excursions", "2", "WEEKS", "BASIC ENGLISH", "USD 1100 per participant (minimum 20 participants) \n\nFee Includes:\n- Group Airport pick up and send off \n- 13 Nights Accommodation Twin Sharing Room without meals\n- Meal Arrangements (Where applicable - Welcome and Farewell Lunch)\n-Logistic Arrangement as stated in the program itinerary\n-Certification of Participation", "NONE", "GENERAL PUBLIC (MUST BE FIT FOR MEDIUM\nTO HIGH OUTDOOR ACTIVITIES AND ENJOY OUTDOOR AND WILLING TO PARTICIPATE IN ALL ACTIVITIES)", "TBC", "\tCERTIFICATE OF PARTICIPATION", "MUHAMMAD HAZIM BIN ZAKARIA"], ["UTM TROPICAL RAINFOREST SUMMER SCHOOL", "NATURE AND ADVENTURE (NAA)", "This program promotes scientific research on developing products from tropical forest resources by exploring and analysing forest-based information. Participants will explore the characteristics of Malaysia’s tropical rainforest biodiversity through guided theories, hands-on activities, and field-based exposure, supported by well-structured courses that include plant extraction and soap making to deepen their understanding and connection with nature.The program is conducted within selected Malaysian forest sites, with the expectation that participants will gain stronger research skills, deeper ecological understanding, and the ability to translate biodiversity knowledge into practical applications.", "Participants will engage in:\n1.Lectures/Classroom Activities\n2. Group activities with local students\n3. Cultural activities\n4. Outdoor activities \n5. Excursions \n", "Through hands-on workshops and practical experiences, participants will:\n\n• Understand the biodiversity and ecological characteristics of Malaysia’s tropical rainforests.\n• Translate ecological observations into actionable insights for product development.\n• Practice safe and ethical methods for working in natural habitats.\n• Strengthen problem-solving and critical thinking through research challenges.\n• Demonstrate accurate data collection, analysis, and interpretation.", "14", "DAYS", "BASIC ENGLISH", "USD 1200 per participant \n\nPrice inclusive of :\n- course materials\n- airport pick-up\n- accommodation\n- ground transportation\n- excursions \n- and meals during program. \n", "NONE", "GENERAL PUBLIC", "TBC", "CERTIFICATE OF COMPLETION", "ZETTY RAIHAN BINTI MOHD YASSIN"], ["PUBLIC MANAGERS EXECUTIVE STUDY VISIT", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "This program introduces participants to Malaysia’s exemplary public administration through immersive experiences. By visiting key government institutions such as MAMPU, AKEPT and others and engaging with public service administrators, participants will learn best practices in governance through expert talk, and policy implementation by the agency. The program combines educational sessions with explorations of Malaysia’s economic, cultural, and environmental attractions, offering a holistic perspective. Participants are expected to enhance their professional knowledge, gain practical insights from Malaysia’s governance model, and experience the country’s unique blend of learning opportunities, economic development, and tourism highlights.", "\nParticipants will engage in:\n• Lectures and classroom activities\n• Group activities\n• Institutional visits\n• Cultural activities\n• Gastronomic excursion\n", "Through hands-on workshops and practical experiences, participants will:\n\n• Understand Malaysia’s public administration framework and governance structure.\n• Develop the ability to critically assess governance strategies and policy decisions..\n• Foster adaptability and openness through immersive experiences in diverse economic, cultural, and environmental settings.\n• Enhance cross-cultural communication and collaboration skills through interactions with public service administrators and peers.", "7", "DAYS", "BASIC ENGLISH", "USD 1800 per participant \n\nPrice inclusive of :\n-course materials,\n-airport pick-up,\n-accommodation,\n-ground transportation,\n-excursions, and\n-meals during program. \n", "NONE", "GENERAL PUBLIC", "TBC", "CERTIFICATE OF COMPLETION", "ZETTY RAIHAN BINTI MOHD YASSIN"], ["THE MALAYSIAN TAPESTRY_LANGUAGE, CULTURE, NATURE, AND HERITAGE", "LANGUAGE AND COMMUNICATION (LAC)", "This summer program designed to immerse participants in Malaysia’s rich multicultural identity and diverse landscapes. Through interactive language and cultural sessions, hands-on workshops, and guided visits to heritage sites and natural attractions, participants will experience the unique blend of Malay, Chinese, Indian, and indigenous traditions that shape the nation. The program offers a balanced mix of academic insight and experiential learning, allowing participants to appreciate Malaysia’s vibrant heritage, environmental treasures, and the stories that weave its social fabric together.", "Participants will engage in:\n• Interactive English language learning to build confidence in communication,\n• Experiential exposure to Malay heritage through a hands-on gamelan class,\n• Immersive nature exploration with an adventurous caving experience at Gua Tempurung,\n• Cultural discovery visits to UNESCO World Heritage Visit (Georgetown & Melaka) and Kuala Lumpur’s iconic landmarks,\n• Hands-on culinary activities celebrating Malaysia’s diverse food traditions and flavors.", "Upon successful completion of the program, participants will be able to:\n• Enhanced English communication skills through structured lessons and real-world practice\n• A deeper appreciation of Malaysia’s traditional arts through hands-on exposure to Gamelan music\n• Awareness of environmental and geological features through guided exploration of Gua Tempurung\n• Insights into Malaysia’s multicultural heritage through visits to UNESCO World Heritage Sites and iconic national landmarks\n• Practical understanding of local culinary traditions through interactive cooking activities", "14", "DAYS", "NONE", "USD1,000 per participant\n\nInclusive of: \n- Professional course & materials\n- Airport transfer & ground transportation\n- Accommodation \n- Entrance fee for the visits & activities\n- Pre & post Oxford Online Test", "NONE", "UNIVERSITY STUDENTS", "N/A", "CERTIFICATE OF COMPLETION", "KHAIRUNNISA AIMI GHAZALI"], ["HELP ENGLISH FOR LEADER PROGRAM", "LANGUAGE AND COMMUNICATION (LAC)", "The HELP English for Leader Programme's aim is to provide International Students with essential English language skills. They will undergo training of the four English language skills namely: writing, reading, speaking and listening. Students will be engaged in English classes crafted based on IELTS modules, delivered by expert second language teachers.Through assignments such as presentations, quizes and video making, students will be able apply the language skills that they have learned in the classroom. At the end of the day, students will be able to apply the language in a multi-cultural environment and alleviate their confidence level in applying English language in their daily lives. ", "Participants in this HELP English for Leader Programme will engage in the following activities:\n\n1. Lectures/Seminars based on IELTS component\n2. Group Discussion & Presentation\n3. Malaysian Cultural Exposure (site visit to museums/art gallery/historical places)\n4. Diagnostic Assessments (Individual)\n5. Video assignment \n6. Final Assessments (Individual)\n7. Excursion: Kuala Lumpur City Tour and either Genting Highlands or Melaka\n ", "By the end of the programme, the students will be able to:\n 1. develop their English language skills in listening, speaking, reading, and writing, \n 2. gain better understanding of IELTS framework \n 3. participate in discussions and activities willingly, actively, and confidently.", "28", "DAYS", "BASIC ENGLISH", "USD 750 per participant\n\nPrice is inclusive of:\n- Accommodation\n- Opening and Closing meal (2 meals)\n- Airport transfer and ground transport \n- Cultural tours (City tour and one inter-state day tour)\n- Programme Certificate \n\nMinimum 25 participants", "NONE", "UNIVERSITY STUDENTS", "SRI TRAVEL SDN BHD", "CERTIFICATE OF PARTICIPATION ", "MR. STEPHEN WU GHEE KEAN"], ["BEYOND THE BORDER_LANGUAGE AND CULTURAL EXPLORATION", "LANGUAGE AND COMMUNICATION (LAC)", "This Language Edutourism Programme offers participants the opportunity to learn one or two languages from a wide range structured lessons at Basic, Intermediate, or Advanced levels. Classes focus on communication skills through interactive and practical learning. Beyond the classroom, participants will engage in cultural workshops, sports, and heritage city trips to enrich their overall learning experience. These experiences enrich language learning and foster intercultural understanding, ensuring participants gain both linguistic proficiency and holistic personal growth.", "Participants will enggage in: \n1. Daily Language Classes (Choice of 1 or 2: Malay / English / Arabic / Chinese / Tamil / Semai / Iban / Kadazandusun / Japanese / Korean / German / French / Spanish) \n2. Cultural Exploration workshop (Activities vary by package option and may include: Traditional dance (Malay/Chinese/Indian) / Batik making / Malay Kitchen / Indian Arts (Henna & Kolam) / Ethnic cultures (Malay/Kadazandusun/Iban/Semai) / Traditional Malay Costume)\n3. Sports activty (Activities vary by package option and may include: Bowling / Golf / Adventure Park / Riverside Picnic) \n4. Local heritage trips (Destinations vary by package option and may include Kuala Lumpur, Kuala Selangor, Taiping, Ipoh, and other selected cities)", "Upon completion of this programme, participants should be able to:\n1. Improve language ability through structured lessons and practical communication in real-life situations.\n2. Develop confidence and versatility in using the target language.\n3. Explore and apply varied learning approaches supported by interactive activities and cultural experiences.\n4. Gain deeper appreciation of Malaysian heritage and traditions while fostering intercultural understanding and global perspectives.", "10 - 14\n(Including the arrival and depature date)", "DAYS", "BASIC ENGLISH", "Optional Packages\nUSD 900-1,150 – 10 days | 14 language learning hours\nUSD 1,150-1,350 – 12 days | 23 language learning hours\nUSD 1,400-1,600 – 14 days | 30 language learning hours\n\nPackage Includes\n1. Accomodation\n2. Language classes fee\n3. Cultural & Heritage Excursions\n4. Cultural workshops & sports activities\n5. Certificate\n6. Airport transfers & ground transportation\n7. Meals (3 times / day) \n(*meals during outings at own expenses)\n8. Souvenirs\n\nGroup Size\nMinimum number of participants: 15 \nMaximum number of participants: 30", "NONE", "GENERAL PUBLIC", "HELLO HOLIDAYS SDN BHD.", "CERTIFICATE OF PARTICIPATION", "MDM TAN LEE NA \nMR. GAN JIA SENG"], ["MIND MATTERS LAB PROGRAMME", "ARTS AND SOCIAL SCIENCE (ANS)", "This programme enhance participants’ knowledge and competencies in core psychological practices. Through immersive activities conducted in a psychology laboratory or training environment, participants will engage in psychological screening and assessment, behavior observation and management, as well as personality and emotional profiling. The programme also emphasizes the application of evidence-based intervention strategies aimed at promoting mental well-being and encouraging positive behavioral change. By combining theoretical understanding with practical skills, Mind Matters EduLab equips learners with the tools needed to support psychological health in both individual and group settings.", "Participants will enggage in:\n1. Lectures\n2. Psychological Screening Simulation\n3.Behavior Observation and Analysis\n4. Personality and Emotional Profiling Workshop\n5. Case Study Assessment and Intervention Planning\n7. Nature tour", "Upon completion of the programme, participants will be equipped with: \n1. Foundational Knowledge & Theoretical Understanding develops core psychological concepts, theories and self-awareness through personality and emotional assessments.\n2. Applied Psychological Assessment & Analysis provides hands-on experience in screenings, behavior observation and critical thinking to design intervention strategies.\n3. Experiential & Environmental Learning promotes reflective practice through nature exposure to enhance holistic understanding of psychological health. \n4. Discover culture and flexibility through immersive Eduventures, Eduvillage and Edunature Forest experiences.\n", "6", "DAYS", "BASIC ENGLISH", "Starting USD 750 per participant \nmininum 15 participant. \n\nPrice inclusive of: \nTuition\nAccommodation \nMeals ( 5 times per day)\nGround Transportation and airport transfer)\nExperiential Learning \nCultural And Nature Tours\nProgramme Certificate\nWelcome and Farewell Ceremony", "NONE", "GENERAL PUBLIC", "AMAZING TRAVEL & TOUR SDN BHD", "CERTIFICATES OF ATTENDANCE", "FARHANA NOHRIN BINTI MOHD ANUAR \n(EDUTORISM COORDINATOR)"], ["INTERNATIONAL PROFESSIONAL DEVELOPMENT TRAINING FOR TEACHERS", "LEADERSHIP AND MANAGEMENT (LAM)", "This two-week intensive program is designed to enhance educators’ pedagogical expertise and broaden their global perspectives. Participants will engage with innovative teaching methodologies, Outcome-Based Education (OBE), student-centered learning, active learning strategies, assessment practices, digital tools, and effective classroom management techniques. Through interactive workshops, peer discussions, self-learning assessments, and enriching field trips, teachers gain practical experience and cultural insights. This combination of professional training and immersion empowers educators to strengthen communication skills, adapt to modern educational challenges, and implement innovative approaches that elevate teaching effectiveness, foster student engagement, and support long-term professional growth.", "Participants will enggage in:\n1. Interactive lectures/seminars/workshops on innovative teaching and assessment practices. \n2. Peer discussions and collaborative learning activities.\n3. Self-learning assessments and reflective exercises.\n4. Educational excursions to heritage sites and ecotourism destinations\n\n*Subject to change", "Upon completion of the program, participants will be equipped with:\n1. Global higher education insights\n2. Innovative, student-centered teaching strategies\n3. Effective assessment techniques and best practices\n4. Skills in using digital tools to enhance learning\n5. Outcome-Based Education (OBE) expertise\n6. Cultural and professional networking with international educators\n7. Self-learning and reflection through daily assessments\n8. Experiential learning from cultural visits and educational excursions", "2", "WEEKS", "BASIC ENGLISH", "USD 1,000 - 1,200 per participants:\n\nPrice inclusive of:\n- Accommodation (Participants who wish to upgrade to a single room may do so for a total fee of USD 1,200)\n- Meals (3 times per day)\n- Training Fee (144 hours) - Access to all workshops, sessions, and learning materials\n- Modules & Kits - Comprehensive training modules and resource kits\n- Educational Visits \n- Ground transportation and airport transfers \n- Insurance\n- Certificate\n\nNote: \nMininum : 10 participants\nMaximum : 25 participants", "NONE", "UNIVERSITY LECTURER/ ACADEMICIAN/ TEACHERS", "TBC", "CERTIFICATE OF COMPLETION", "INTERNATIONAL, MOBILITY AND ADVANCED EDUCATION CENTRE (IMAC)"], ["FARMTASTIC TOUR", "AGRICULTURE AND VETERINARY (AAV)", "This integrated edu-tourism program is designed for students, families, and publics, immersing them in a comprehensive agricultural experience through five distinct hands-on activities. Participants will engage directly in sustainable food production, either guided fish farm tour, poultry experience tour, bee farm tour, fertigation farm tour, or sunflower experience tour. The overall impact is a profound enhancement of agricultural literacy, fostering a deeper appreciation for food sources, demystifying modern and traditional farming techniques, and empowering participants with practical knowledge about nutrition, sustainability, and the vital connection between farm practices and their daily lives.", "Participant will engage in:\n1. Connect the harvest from each agricultural station directly to a local culinary tasting experience.\n2. Prepare of local traditional dishes using the participants' own harvested agricultural product.\n3. Guide tasting sessions of raw and processed local products.\n4. Foster a deep, tangible appreciation for sustainable agriculture and its direct impact on food quality, health, and local culinary heritage.", "Upon completion of the program, participants will be able to:\n- Develop practical agricultural literacy by mastering hands-on techniques in either guided fish farm tour, poultry experience tour, bee farm tour, fertigation farm tour, or sunflower experience tour. \n- Enhance awareness of the farm-to-fork journey by tracing food production from source to plate, fostering informed consumer choices.\n- Build competencies in resource management and problem-solving through activities like mixing nutrient solutions and managing harvesting schedules.", "1", "DAYS", "BASIC ENGLISH", "USD200 - USD350 per participants\n\nPrice inclusive of:\n\n- Tuition and Training Materials\n- Meals (3 times per day)\n- Ground transportation\n- Airport transfer\n- Insurance\n- Certificate of participation\n\nMinimum of participant: 20 participants\nMaximum of participant: 30 participants", "NONE", "GENERAL PUBLIC", "TBC", "CERTIFICATE OF PARTICIPATION", "ANIZAH MOHD SALLEH"], ["GlOBAL DISCOVERY WEEK FOR SHAPING FUTURE MINDS THROUGH COMMUNICATION INCLUDING SUSTAINABILITY AND INNOVATION", "FOOD, CULTURE AND HERITAGE (FCH)", "Swinburne University of Technology Sarawak Campus’s Global Discovery Week provides international learners with an immersive English educational experience that combines academic learning with real-world exploration in Sarawak. Through guided field visits, interactive workshops, and curated study tours, participants explore the region’s rich biodiversity and vibrant cultural heritage. The uniqness of this programme is to enhance cross-cultural communication, provide exposure to biodiversity and sustainability practices, and develop broader global perspectives among students. By the end of the programme, participants gain meaningful learning experiences that strengthen their English communication skills, deepen cultural understanding, and inspire curiosity,
