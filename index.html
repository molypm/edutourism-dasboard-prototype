innovation, and building international friendships and collaborative learning networks that extend beyond the classroom.", "Participants will engage in:\n\n1. On-campus classes and hands on activities emphasising practical application,guided exercises and collaborative learning.\n2. Cultural Tour through Sarawak River Cruise & Kuching Waterfront\n3. Study visit at Borneo Cultures Museum, Private High School, Semenggoh Wildlife Centre, Biodiversity Centre", "Upon completion of the program, participants will be equipped with:\n\n1. Explore key global themes - culture, sustainability, biodiversity, AI and business - in engaging context.\n2. Develop critical and creative thinking to understand challenges and opportunities in a rapidly changing world.\n3. Strengthen English communication skills through interactive and practical activities.", "1", "WEEKS", "BASIC ENGLISH", "USD900 per participant\n\nPrice inclusive of: \n- Accomodation \n- Ground transportation and airport transfer\n- Cultural tours\n- Meals (3 times a day)\n- Welcome and Farewell ceremonies\n- Program certificates", "NONE", "UNIVERSITY STUDENTS", "", "CERTIFICATE OF PARTICIPATION", "MOHAMAD SAFAREE BIN SAPUAN"], ["LEADERSHIP COMMUNICATION PROGRAMME", "LANGUAGE AND COMMUNICATION (LAC)", "Welcome to the Leadership Communication Programme, a short-term course designed for students eager to develop effective communication skills and a strong leadership identity. The programme combines foundational theories with interactive workshops, role-playing activities, and real-world communication scenarios to create a practical learning experience. Participants will enhance their verbal and written communication skills while building confidence in expressing ideas clearly and professionally. Through guided activities and reflective practices, participants will cultivate a consistent leadership presence that inspires trust and fosters collaboration. By the end of the programme, participants will be able to communicate effectively and demonstrate essential leadership qualities in academic and professional settings.", "Participants will engage in:\n\n1. Classroom-based learning sessions focusing on leadership communication theories and practical applications in professional contexts.\n2. Role-playing activities based on Malaysian cultural scenarios to enhance verbal and written communication skills in diverse settings.\n3. Storytelling workshops designed to develop persuasive communication, presentation skills, and personal expression.\n4. Team-building communication activities to strengthen collaboration, leadership presence, and interpersonal effectiveness.\n5. Educational excursions around Kuala Lumpur such as Central Market, Petaling Street, National Musuem, KLCC, Batu Caves & etc", "Upon completion of the programme, participants will be equipped with:\n\n1. Enhanced verbal and written communication skills for effective leadership and professional interaction.\n2. The ability to develop and project a consistent and authentic leadership identity that inspires trust and collaboration.\n3. Improved confidence in expressing ideas, engaging audiences, and communicating effectively in academic and professional contexts.", "2", "WEEKS", "NONE", "USD1,500 per participant\n\nPrice inclusive of: \n- Accommodation \n- Meals (3 times per day)\n- Ground transportation and airport transfer\n- Learning materials\n- Insurance \n- Participation certificate\n- Welcome and Farewell Ceremonies\n\nNote: Minimum 20 participants", "NONE", "GENERAL PUBLIC", "", "CERTIFICATE OF PARTICIPATION", "DR. NELSON TEH"], ["GLOBAL BUSINESS WAVES", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "Welcome to the Global Business Waves Programme, a short-term course designed for students interested in understanding international business dynamics and global market trends. The programme combines foundational knowledge with interactive workshops, case studies, and real-world business scenarios to create a practical learning experience. Participants will explore key concepts such as cross-cultural management, global strategy, and international trade while developing critical thinking and decision-making skills. Through experiential learning and industry exposure, participants will gain valuable insights into the global business environment. By the end of the programme, participants will be able to apply business concepts and navigate the complexities of the global marketplace.", "Participants will engage in:\n\n1. Classroom-based learning sessions introducing key concepts of international business, global markets, and economic trends.\n2. Analysis of international case studies to develop critical thinking and problem-solving skills in real-world business contexts.\n3. Business documentary screenings followed by guided discussions to enhance understanding of global business practices and challenges.\n4. Business dynamic tours to selected organisations or business environments for practical exposure and industry insights.\n5. Strategic team-based activities, such as treasure hunt challenges, to promote collaboration, strategic thinking, and decision-making skills.", "Upon completion of the programme, participants will be equipped with:\n\n1. A comprehensive understanding of international business dynamics, including global economic trends and market environments.\n2. Practical knowledge of cross-cultural management and strategic decision-making in diverse business contexts.\n3. Enhanced critical thinking, teamwork, and problem-solving skills through experiential and applied learning activities.", "2", "WEEKS", "BASIC ENGLISH", "USD1,500 per participant\n\nPrice inclusive of: \n- Accommodation \n- Meals (3 times per day)\n- Ground transportation and airport transfer\n- Learning materials\n- Insurance \n- Participation certificate\n- Welcome and Farewell Ceremonies\n\nNote: Minimum 20 participants", "NONE", "UNIVERSITY AND COLLEGE STUDENTS", "", "CERTIFICATE OF PARTICIPATION", "DR. NELSON TEH"], ["STEM EXPLORATION", "SCIENCE AND TECHNOLOGY (SAT)", "This 1-week programme provides participants with interdisciplinary exposure to science, technology, and innovation in the Global South context. Through academic sessions, laboratory visits, and industry engagement, participants explore how STEM research and innovation in Malaysia drive societal advancement, sustainable development, and digital transformation. The programme is unique in combining applied scientific learning with experiential exposure and cultural immersion, enabling participants to understand how Malaysia’s socio-cultural context shapes innovation. By the end of the programme, participants gain practical knowledge, problem-solving skills, and insights to contribute meaningfully to STEM innovation and technology solutions regionally and globally.", "Participants will engage in:\n\n1. Interactive academic modules on STEM concepts, research, and innovation.\n2. Hands-on laboratory sessions to apply scientific and technological techniques.\n3. Industry visits to tech companies, research centres, and innovation hubs.\n4. Cultural immersion and campus tours to explore how Malaysia’s cultural and social environment influences STEM innovation.", "Upon completion of the program, participants will be able to:\n\n1. Develop interdisciplinary understanding of STEM in the Global South context.\n2. Gain exposure to applied research and laboratory practices.\n3. Understand how scientific research translates into real-world solutions.\n4. Assess the influence of socio-cultural factors on STEM innovation.", "1", "WEEKS", "BASIC ENGLISH", "USD1,200 per participant\n\nPrice inclusive of:\n• Tuition and academic materials\n• Accommodation\n• Airport transfers and ground transportation\n• Cultural and heritage activities\n• Community engagement activities\n• Field visits and excursions\n• Welcome and Farewell Ceremony\n• Programme Certificate\n\nNote: Minimum no.of 20 participants", "NONE", "UNIVERSITY STUDENTS", "", "CERTIFICATE OF PARTICIPATION", "NUR EFARINA BINTI AZNAN"], ["ASBHIVE GLOBAL YOUTH ENTREPRENEURSHIP AND INNOVATION PROGRAMME", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "This programme is an immersive experiential learning camp designed to develop entrepreneurial thinking, innovation skills, and global perspectives among youth participants. It is delivered through interactive workshops, team-based projects, financial simulations, pitching sessions, and cultural immersion activities within a campus-based learning environment. The programme’s uniqueness lies in its integration of design thinking, real-world application, and exposure to academic and industry expertise in a global learning setting. It aims to equip participants with foundational entrepreneurial knowledge, problem-solving skills, communication confidence, and the ability to collaborate and develop innovative solutions in diverse contexts.", "Participants will engage in:\n\n1. Interactive workshops on entrepreneurship, innovation, and design thinking frameworks.\n2. Team-based project development focusing on problem-solving, ideation, and business model exploration.\n3. Financial literacy simulations and experiential activities to understand value creation and decision-making.\n4. Communication, storytelling, and pitching sessions culminating in a demo day.\n5. Cultural immersion and campus-based experiential learning to enhance global exposure and student engagement.", "Through hands-on and practical experiences, participants will gain:\n\n1. Foundational knowledge of entrepreneurship, innovation, and future-ready competencies.\n2. Hands-on experience in creative problem-solving, teamwork, and leadership through experiential learning.\n3. Enhanced communication and public speaking confidence through guided pitching and collaborative exercises.\n4. Broader global awareness and intercultural competence through structured cultural and real-world engagement experiences.", "6", "DAYS", "BASIC ENGLISH", "USD3,000 per participant\n\nPrice inclusive of:\n- Tuition\n- Ground transport and airport transfers \n- Traditional and cultural activities\n- Cultural tours\n- Certificate\n\nNote: Minimum no. of 30 participants, maximum no. of 50 participants", "NONE", "GENERAL PUBLIC\n(Aged between 16 to 25 years old)", "", "CERTIFICATE OF PARTICIPATION /  CERTIFICATE OF APPRECIATION", "Nurainna Syahirrah"], ["LINCOLN GLOBAL BUSINESS LEADERS", "BUSINESS AND ENTREPRENEURSHIP (BAE)", "Lincoln Global Business Leaders 2026 is a transformative edutourism programme spanning 7 days, designed to equip participants with ethical leadership and entrepreneurial acumen. Integrating business management, Islamic banking, hospitality, and organisational psychology. The programme bridges academic theory with real-world industry immersion, which by the end, participants will be able to understand global business ethics, apply inclusive leadership strategies, and further explore sustainable entrepreneurship models. Participants will document their experiences and reflections through heritage tours, industry dialogues, and community engagement, culminating in measurable competencies for global employability and leadership.", "Participants will engage in:\n\n•Engagement Workshops: Focused on business ethics and social entrepreneurship\n•Industry Immersion: Strategic visits to multinational corporations, Islamic banking, and hospitality hubs.\n•Heritage Tours: Case studies on trade and leadership at UNESCO sites.\n•Expert Dialogues: Roundtables with CEOs and corporate leaders on diplomacy, ethics, and innovation.\n• Corporate Social Responsibility (CSR): Community projects centered on entrepreneurship and sustainable development.", "Upon completion of the programme, participants will be able to:\n\n•Master the principles of business ethics, inclusive leadership, and organizational psychology in a global context.\n•Analyse operational models within multinational corporations.\n•Evaluate historical trade models and cultural synergy through the lens of UNESCO heritage sites.\n•Apply sustainable development goals to community-based projects to foster civic responsibility and empathy.", "1", "WEEKS", "INTERMEDIATE ENGLISH", "USD2,700 per participant \n\nPrice inclusive of:\n• Accommodation\n• Meals (5 times a day)\n• Ground transportation and airport transfer\n• Insurance\n• Certificate of Participation\n• Welcome/Farewell Ceremonies \n\nNote: Minimum no. of 10 participants, maximum no. of 30 participants", "NONE", "GENERAL PUBLIC", "", "CERTIFICATE OF COMPLETION / CERTIFICATE OF PARTICIPATION", "MOHD NIKMAT BIN WAHIB"], ["TASTE OF MALAYSIA_A CULTURAL CULINARY EXPERIENCE", "FOOD, CULTURE AND HERITAGE (FCH)", "The unique programme designed to introduce participants to the rich diversity of Malaysian culinary heritage. The programme combines cultural learning with hands-on cooking experiences that allow participants to explore traditional Malaysian dishes, ingredients, and cooking techniques. Through guided culinary activities, food tasting sessions, and cultural storytelling, participants will gain insights into how food reflects Malaysia’s multicultural traditions and lifestyle. The programme encourages cultural appreciation while providing participants with meaningful culinary experiences. By the end of the programme, participants will develop a deeper understanding of Malaysian food culture and its significance within local communities.", "Participants will engage in:\n\n• Hands-on workshops preparing traditional Malaysian dishes and local delicacies.\n• Cooking demonstrations guided by experienced chefs and culinary facilitators.\n• Exploration of traditional ingredients, spices, and cooking techniques used in Malaysian cuisine.\n• Cultural food tasting sessions featuring popular local dishes and street food.\n• Interactive discussions about Malaysian food culture, traditions, and heritage.", "Upon completion of the programme, participants will be able to:\n\n• Understand the diversity of Malaysian cuisine and cultural food traditions.\n• Develop basic culinary skills in preparing traditional Malaysian dishes.\n• Identify local ingredients, spices, and cooking methods used in Malaysian cuisine.\n• Appreciate the role of food in Malaysian culture and social traditions.", "1", "WEEKS", "BASIC ENGLISH", "USD2,000 per participant\n\nPrice inclusive of:\n• Accommodation\n• Meals\n• Ground transportation and airport transfer\n• Certificate\n\nNote: Minimum no. of 10 participants", "NONE", "GENERAL PUBLIC\n(aged 18 years and above)", "", "CERTIFICATE OF PARTICIPATION", "Mohamad Fairuz bin Norman"], ["UKM EARTH X CHANGE PROGRAMME", "ENVIRONMENTAL AND HEALTH SCIENCE (EHS) ", "The UKM Earth X Change Programme is an immersive short course for high school and university students that combines theoretical learning with hands-on activities and educational field trips to explore environmental studies, natural resources, and earth sciences. Led by experts from Universiti Kebangsaan Malaysia (UKM), the programme integrates lectures, group work, and practical exercises to create a dynamic learning environment. It enables participants to connect theoretical concepts with real-world environmental observations while gaining exposure to scientific methods, practical applications, and current environmental issues. Through this approach, participants develop critical thinking and problem-solving skills, deepen their understanding of earth systems, and build a stronger appreciation for the environment. Ultimately, the programme aims to foster environmental awareness, enhance knowledge, and inspire participants to actively engage in sustainable practices and environmental conservation.", "Participants will engage in:\n\n1. Live online sessions introducing key foundational concepts and preparing participants for the in-person learning week.\n2. On-campus classes and hands-on activities emphasising practical application, guided exercises, and collaborative learning.\n3. Educational Trip to Langkawi Geopark, Fraser's Hill Research Centre and Ulu Slim Hot Spring to experience academic, culture, heritage, and real-world learning.", "Upon completion of the program, participants will be able to:\n\n1. Demonstrate a fundamental understanding of environmental studies, natural resources, and earth science concepts.\n2. Relate theoretical knowledge to real-world observations through fieldwork and hands-on activities.\n3. Identify current environmental challenges and propose appropriate, sustainable solutions.\n4. Develop critical thinking, problem-solving, and teamwork skills through collaborative tasks.\n5. Exhibit increased awareness and responsibility towards protecting the environment.", "10", "WEEKS", "BASIC ENGLISH", "USD1,500 per participant\n\nPrice inclusive of:\n- Tuition\n- Ground transportation and airport transfer\n- Interaction and college activities\n- Experiential learning\n- Educational trips\n- Programme Certificate\n\nMinimum no. of 20 participants and maximum no. of 50 participants", "NONE", "UNIVERSITY AND HIGH SCHOOL STUDENTS", "", "CERTIFICATES OF PARTICIPATION", "ASSOC. PROF P.GEOL TS DR. MOHD HARIRI BIN ARIFIN"], ["ROBOX MALAYSIA CREATIVE AUTOMATION AND CROSS‑CULTURAL DISCOVERY", "SCIENCE AND TECHNOLOGY (SAT)", "This program blends technical discovery and cultural exploration. Participants learn fundamentals of robotics and additive manufacturing, build simple prototypes through 3D printing workshops, and experience the excitement of local robot competitions. In addition, participants expose to local cultural through activities by showing how innovation and culture intersect in everyday life. This program stands out by blending robotics technology and cultural experiences, with the aims to inspire creativity, cross-cultural understanding, and practical skills in technology and design.", "Participants will engage in: \n\n• Essential robotics concepts and automation systems through engaging demonstrations designed to spark curiosity and understanding.\n• Building and program simple robots, gaining practical skills in motion control, sensors, and basic automation logic.\n• Exploring modern rapid‑prototyping techniques by designing and printing their own 3D components using accessible digital fabrication tools.\n• A local robot competition, witnessing innovative engineering solutions and the excitement of real‑world robotics challenges.\n• An engaging activity exploring Malaysian local foods, lifestyles, and traditions for international students.", "Upon completion of the programme, participants will be equipped with: \n\n1. Fundamental knowledge of robotics, automation, and 3D printing, enabling them to understand how modern smart technologies operate.\n2. Practical hands‑on experience in building and programming simple robots, as well as designing and printing basic 3D components.\n3. Exposure to real competitive robotics environments, enhancing their appreciation of innovation, teamwork, and engineering creativity.\n4. Broader cultural awareness through immersive experiences that highlight Malaysia’s rich multicultural heritage.", "2", "WEEKS", "BASIC ENGLISH", "USD 1,000 per participant\n\nPrice inclusive of:\n• Academic modules and materials\n• Accommodation\n• Ground transportation and airport transfer\n• Traditional and cultural activities\n• Experiential learning\n• Cultural tours\n• Meals\n• Program Certificate\n\nNote: Minimum no. of 15 participants", "NONE", "GENERAL PUBLIC", "", "CERTIFICATE OF PARTICIPATION", "Thong Li Wah"], ["EXPLORE EXPRESS AND EXPERIENCE ENGLISH", "LANGUAGE AND COMMUNICATION (LAC)", "The Explore, Express and Experience English Adventure programme at SEGi College Penang is a dynamic and immersive experience designed for high school students to develop their English language skills. The participants will explore Penang’s UNESCO‑listed heritage through an academically guided walk, practice cultural and artistic vocabulary in a structured batik workshop, and use functional English while preparing Malaysian cuisine. Blending English language instruction with hands-on cultural activities, the programme offers the participants a unique opportunity to practice English in real-world contexts and engage with Penang’s diverse communities. The programme culminates in a final presentation and cultural showcase, highlighting students’ growth in English proficiency, cultural literacy, and confidence using the language in real‑world contexts.", "Participants will engage in:\n\n• A multicultural language exchange, using English as the academic medium to compare Japanese and Malaysian cultural practices.\n• An academically guided heritage walk in George Town, applying descriptive and reflective English skills while learning about Penang’s UNESCO‑listed multicultural history.\n• A structured batik painting and art workshop, using English to learn artistic concepts, cultural terminology, and presentation skills related to traditional Malaysian batik.\n• An instructional cooking session on Malaysian cuisine, focusing on functional English for explaining processes, ingredients, and cultural significance.\n• A final academic presentation and cultural showcase, demonstrating English proficiency through project presentations, reflection, and performance.", "Upon completion of the programme, participants will be able to:\n\n• Demonstrate improved English communication skills through speaking, listening, reading, and writing tasks during guided activities and presentations.\n• Describe and reflect on Penang’s multicultural heritage using descriptive and comparative English in heritage walks and cultural exchanges.\n• Apply functional and topic‑specific vocabulary related to culture, art, cuisine, and intercultural communication in hands‑on workshops.\n• Demonstrate appreciation of local traditions and intercultural perspectives through respectful participation and reflective discussion.\n• Produce and present creative group outputs in English, organizing ideas clearly for project presentations and cultural showcases.", "9", "DAYS", "BASIC ENGLISH", "1) USD240 per participant\nFor groups with less than 20 participants\n\n2) USD210 per participant\nFor groups with 20 or more participants\n\nPrince inclusive of: \n• Materials\n• Certificate of attendance\n• Farewell lunch", "NONE", "HIGH SCHOOL STUDENTS", "", "CERTIFICATE OF ATTENDANCE", "SHAHREENA BINTI AHAMADSHA"], ["THE IELTS DISCOVERY PROGRAM 1", "LANGUAGE AND COMMUNICATION (LAC)", "The English Preparatory Class is a face-to-face programme designed to develop students’ foundational and academic English skills while preparing them for future IELTS success . The programme adopts a structured and immersive approach through interactive lessons, guided practice, and continuous assessment focusing on listening, speaking, reading, and writing skills . A key feature of the programme is its emphasis on real-life communication and academic application, allowing students to build confidence in both formal and informal contexts. The programme aims to enhance students’ fluency, accuracy, and readiness to perform effectively in academic environments and standardized English assessments.", "Participants will engage in:\n\n1. Structured classroom sessions focusing on integrated practice of listening, speaking, reading, and writing skills.\n2. IELTS-oriented workshops including timed writing tasks, reading comprehension exercises, listening practices, and speaking simulations.\n3. Interactive face-to-face activities such as group discussions, role-plays, presentations, and real-life communication practice in formal and informal contexts.", "Upon completion of the program, participants will be equipped with:\n\n1.Improved proficiency in listening, speaking, reading, and writing skills for academic and everyday communication.\n2.The confidence and strategies needed to apply English effectively in formal and informal situations, including readiness for the IELTS examination.\n3. A strong academic English foundation to support progression into higher education and future career opportunities.", "4", "WEEKS", "BASIC ENGLISH", "USD2,350 per participant\n\nPrice inclusive of:\n* 3-week online IELTS preparation (Listening, Reading, Writing, Speaking)\n* 6-day intensive programme in Malaysia\n* IELTS workshops, exam strategies & practice simulations\n* Accommodation & 3 meals daily (during physical programme)\n* Airport transfers & local transportation\n* Guided tours & cultural immersion activities\n* Certificate of Participation & Completion\n\nNote: Minimum no. of 10 participants, Maximum no. of  20 participants", "NONE", "GENERAL PUBLIC", "", "CERTIFICATE OF COMPLETION / CERTIFICATE OF ATTENDANCE", "NURZIANA"], ["VET BEYOND BORDER", "AGRICULTURE AND VETERINARY (AAV)", "Vet Beyond Border (VBB) is an innovative initiative that integrates veterinary education with cultural exchange, providing students with experiential learning beyond the classroom. The programme is structured through supervised hands-on clinical training, laboratory diagnostics, fieldwork, case discussions, and community-based animal health initiatives, complemented by immersive exploration of Kelantan’s local culture and heritage. As one of the unique veterinary edutourism programme in Malaysia, VBB combines professional veterinary training with cultural immersion, delivering contextual, practical, and high-impact learning experiences.The programme aims to nurture globally competent, culturally aware, and practice-ready veterinary graduates who are capable of integrating technical expertise with community engagement.", "Participants will engage in:\n\n1. Veterinary clinical training which provides comprehensive small and large animal internal medicine exposure at the Veterinary Teaching Hospital and Teaching Farm while emphasizing on clinical examination, case management, and evidence-based decision-making.\n2. Laboratory diagnostics, gaining practical exposure to diagnostic workflows, including sample collection and handling, fundamental laboratory techniques, and result interpretation.\n3. Exotic animal management, where they will receive supervised experience in the handling, health assessment, and management of selected exotic species at Exotel.\n4. Cultural exploration in Kelantan through immersive participation in local heritage activities, traditional practices, and meaningful community engagement.", "Through hands-on and practical experiences, participants will gain:\n\n1. expertise in handling small and large animal internal medicine, including systematic clinical examination, diagnostic reasoning, and evidence-based case management at both individual and herd levels.\n2. skills to perform proper sample handling procedures, apply biosafety practices, conduct basic laboratory techniques, and accurately interpret diagnostic results to support clinical decision-making.\n3. knowledge on how to handle selected exotic species safely, conduct basic health assessments, and apply appropriate welfare and preventive care practices under supervision.\n4. cross-cultural communication and professional awareness by understanding local socio-cultural and community contexts.\n", "1", "MONTHS", "INTERMEDIATE ENGLISH", "USD 400 - 650 per participants\n\nPrice inclusive of;\n1. Internship fee (veterinary hospital/teaching farm/laboratory/exotel)\n2. Selected veterinary courses\n3. Accommodation\n4. Ground transport & airport transfer\n5. Certificate of participation\n6. Memorabilia/party gift\n\nMinimum no. of 5 participants, maximum no. of 10 participants", "ELIGIBLE\n(SUBJECT TO THE HOME COLLEGE'S REQUIREMENT)", "VETERINARY STUDENT/ PROFESSIONAL", "", "CERTIFICATE OF PARTICIPATION", "DR. ROSLINA BINTI RASHID"], ["ARCHI_EKISTICS KELANTAN_ARKISAN", "FOOD, CULTURE AND HERITAGE (FCH)", "This programme transforms architectural education into an immersive, experiential learning journey that focuses on timber tectonics, environmental relationships, and heritage preservation through applied architectural practices. It is delivered through hands-on exploration of no-nail timber construction techniques, site documentation of architectural relationships within coastal and urban environments, and creative outputs such as professional digital portfolios and urban sketching. The programme uniquely integrates architecture, interior design, and landscape perspectives while emphasizing traditional craftsmanship, contextual learning, and visual storytelling as tools for documenting and preserving heritage which aims to equip participants with practical skills in timber construction, enhance their ability to analyze spatial environments, and foster appreciation for architectural heritage through innovative and creative documentation methods.", "Participants will engage in:\n\n1. The Tanggam Challenge, a hands-on workshop at Masjid Kampung Laut where participants will identify and sketch the intricate wood-joinery system that holds the structure together without the use of nails.\n2. The Living History session, an informal and authentic discussion with the homeowner of a traditional Rumah Tiang 12, where participants will listen to the untold stories of the building’s evolution, spiritual layout, and interior features over local coffee.\n3. The Urban Sketching Battle, a high-energy live sketching session in the Kota Bharu Heritage Zone, collaborating with the local Urban Sketchers community to capture colonial and vernacular architectural facades.\n4. The Singgora Lab, a materiality workshop in Bachok where participants will mould their own traditional clay roof tiles.\n5. The Scavenger Design Hunt, a gamified photography activity across historical sites in Kota Bharu, where participants will search for specific interior motifs and architectural ornaments.", "Upon completion, participants will be able to: \n\n1. understand traditional construction (such as timber joinery) and the cultural and design principles behind vernacular and colonial heritage buildings like Masjid Kampung Laut.\n2. document architectural details through urban sketching and apply hands-on skills by moulding traditional clay roof tiles.\n3. capture architectural motifs and spatial elements through photography and sketching during gamified exploration activities.\n4. cultivate appreciation, creativity, and respect for architectural heritage, traditional craftsmanship, and local history.", "5", "DAYS", "BASIC ENGLISH", "USD 500 per participants\n\nPrice inclusive of: \n1. Program Kit & Materials\n2. Accommodations\n3. Meals \n4. Ground transportation\n5. Management & operations cost\n6. Program Certificate\n\nMinimum no. of 10 participants, maximum no. of 20 participants", "NONE", "GENERAL PUBLIC", "", "CERTIFICATE OF PARTICIPATION / CERTIFICATE OF APPRECIATION", "YUVEELAI BUNJARIDH BINTI NOP"], ["USIM SUMMER COURSE", "LEADERSHIP AND MANAGEMENT (LAM)", "The Integrated Naqli & Aqli Leadership & Cultural Immersion Programme is an international short-term academic mobility initiative designed to introduce participants to the holistic Islamic higher education model practiced at Universiti Sains Islam Malaysia (USIM). The programme integrates Naqli (revealed knowledge) and Aqli (rational knowledge) approaches in Malaysian leadership, strategic thinking, and cross-cultural engagement, creating a balanced and meaningful learning experience. Participants will take part in interactive academic modules, community engagement activities, and curated educational visits across Negeri Sembilan, Putrajaya and Kuala Lumpur. By the end of the programme, participants are expected to develop ethical leadership qualities, strengthen intercultural understanding and gain global perspectives while appreciating Malaysia’s multicultural heritage and Islamic academic ecosystem.", "Participants will enggage in:\n\n1. Interactive academic modules and leadership training, introducing key concepts in Naqli and Aqli integration, strategic thinking and cross-cultural leadership through guided and collaborative learning sessions.\n2. Academic immersion at Universiti Sains Islam Malaysia (USIM), including faculty-based engagements and knowledge exchange that highlight the holistic Islamic higher education model in practice.\n3. Community engagement and cultural immersion experiences at a Malaysian village, involving interaction with local communities and exposure to Malaysia’s multicultural heritage through structured activities and shared learning.\n4. Educational visits and reflective learning sessions, offering real-world insights through selected landmark visits across Negeri Sembilan, Putrajaya, and Kuala Lumpur, followed by programme reflection and certification.", "Upon completion of the program, participants will be equipped with:\n\n1. Understanding of the integration of Naqli and Aqli knowledge in leadership and management.\n2. Enhanced intercultural communication and global leadership competencies.\n3. Exposure to Islamic higher education governance and academic structure in Malaysia.\n4. Practical insight into community engagement and sustainable social responsibility.\n5. Broader regional awareness through experiential cultural immersion.", "10", "DAYS", "BASIC ENGLISH", "USD 1,200 per participant\n\nPrice inclusive of:\n- Academic modules and materials\n- Accommodation\n- Airport transfers and ground transportation\n- Cultural and community activities\n- Educational site visits\n- Meals (3 times a day)\n- Programme certificate\n- Welcome and Farewell Ceremonies\n\nNote: Minimum no. of 30 participants", "NONE", "GENERAL PUBLIC\n(aged 18 years and above)", "", "CERTIFICATE OF PARTICIPATION /  CERTIFICATE OF COMPLETION", "MUHAMMAD LUQMAN HAKIM BIN MOHD NAZRI"], ["EDUCULTURE TOUR PROGRAMME- INTERNATIONAL MANAGEMENT AND GLOBAL BUSINESS", "LEADERSHIP AND MANAGEMENT (LAM)", "The Educulture Tour Programme is strategically designed to integrate cultural exploration with international management and global business learning. Through structured visits to cultural landmarks, industry sites, and business hubs, students examine how cultural contexts shape management styles, leadership approaches, and market strategies across countries. Its unique design combines experiential learning, academic insights, and real world exposure, enabling students to engage with diverse stakeholders and business environments. The programme emphasizes collaborative tasks and cross cultural interaction to strengthen global communication and decision making skills. Its primary goal is to develop adaptable, culturally intelligent graduates equipped to navigate and lead in complex international business settings.", "Participants will engage in:\n\n1. Classroom training on international management and global business concepts\n2. Cultural activities to understand local traditions and social practices\n3. Industry visits to observe real-world business operations\n4. Business hub visits to explore global market environments\n5. Excursion activities to experience Cultural and historical landmarks", "Upon completion of the programme, participants will be able to:\n\n1. Explain key concepts of international management and global business practices and analyze how cultural differences influence leadership styles, communication, and decision making.\n2. Demonstrate teamwork and problem solving skills during collaborative tasks and site visits, at the same time apply cross cultural communication skills in real life interactions and group activities \n3. Develop cultural awareness and appreciation of global diversity and build confidence in interacting within international and professional settings\n", "5", "DAYS", "BASIC ENGLISH", "USD 480 per participant \n\nPrice inclusive of:\n1. Accomodation\n2. Meals (5 times a day)\n3. Ground Transportation and Airport Transfer\n4. Certificate \n5. Welcome and Farewell Ceremonies\n\nNote:\n1. Minimum no. of 20 participants, maximum no. of 40 participants\n2. Fee waiver is granted for one participant for every 30 participants", "NONE", "GENERAL PUBLIC", "", "CERTIFICATE OF APPRECIATION", "Thana Pakkiam A/P Krishnan"], ["ENGLISH QUEST 360_FROM THE CLASSROOM TO THE REAL-WORLD EXPERIENCE (3 MONTHS)", "LANGUAGE AND COMMUNICATION (LAC)", "The three-month English Quest 360: From The Classroom To The Real-World Experience is an experiential course designed to strengthen learners’ proficiency in listening, speaking, reading, and writing while promoting deeper application and collaboration. It combines structured classroom instruction with guided excursions, project-based learning, writing workshops, and peer teaching to support active, collaborative learning. Its unique approach integrates academic learning with immersive cultural and real-world experiences, enabling learners to apply English in authentic contexts and culminating in a capstone showcase that highlights their skills and confidence. The programme develops learners’ ability to communicate effectively, think critically, collaborate, and engage meaningfully in diverse, real-world situations.\n", "\nParticipants will engage in:\n\n(1) Structured English learning across listening, speaking, reading, and writing through classroom sessions, interactive workshops, and group discussions.\n(2) Experiential, project-based exercises to practice English, including presentations, public speaking, and reflective activities.\n(3) Guided excursions and community engagement to apply English in real-world and cultural contexts.\n", "Upon completion of the programme, participants will be able to:\n\n1. Demonstrate comprehensive English language skills in listening, speaking, reading, and writing for academic and everyday communication.\n2.Confidently deliver presentations and participate in group discussions to effectively communicate ideas. \n3. Collaborate with peers in multicultural settings using appropriate interpersonal language skills.\n4..Apply English  if(t==='completed')a.status='Confirmed Attending';else if(['pass_declined','not_going','did_not_attend'].includes(t))a.status='Did Not Proceed';

function openTracker(id,mode){const a=state.apps.find(x=>x.id===id),p=prog(a.prog),has=t=>evOf(a,t);
 const chips=(arr,fn)=>`<div class="chipset" style="margin-top:8px">${arr.map(r=>`<button type="button" class="opt-chip" style="padding:6px 12px;font-size:13px" onclick="${fn}('${id}','${r}')">${r}</button>`).join('')}</div>`;
 const step=(ok,title,body)=>`<div class="trs ${ok?'done':''}"><span class="tic">${ok?'✓':''}</span><div style="flex:1"><b>${title}</b>${body||''}</div></div>`;

 if(r.t==='Number'){return +a>=+e?'ok':'chk'}const L=['beginner','basic','intermediate','advanced'];const ia=L.findIndex(x=>a.includes(x)),ie=L.findIndex(x=>e.includes(x));if(ia>=0&&ie>=0)return ia>=ie?'ok':'chk';return a===e?'ok':'chk'}

 if(d==='A')body=`<div class="info">Publishes to the public site straight away. You can undo for a few seconds.</div>${msg('Message to university <span class="note">(optional)</span>')}<button class="btn ok" onclick="kDecide('${p.id}','Published')">Approve & publish</button>`;
 if(d==='C')body=`<div class="f" style="margin-top:12px"><label>What needs to change? <span class="note">Pick the section and, if you can, the field.</span></label>${kit.items.map((it,i)=>`<div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap"><select style="width:auto;max-width:190px" onchange="kit.items[${i}].sec=this.value;kit.items[${i}].fld='';render()">${KSEC.map(k=>`<option value="${k[0]}" ${it.sec===k[0]?'selected':''}>${k[1]}</option>`).join('')}</select>${(KFIELDS[it.sec]||[]).length?`<select style="width:auto;max-width:170px" onchange="kit.items[${i}].fld=this.value"><option value="">Whole section</option>${KFIELDS[it.sec].map(x=>`<option value="${x[0]}" ${it.fld===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`:''}<input style="flex:1;min-width:180px" placeholder="e.g. State the currency and whether accommodation is included" value="${esc(it.text)}" oninput="kit.items[${i}].text=this.value">${kit.items.length>1?`<button class="btn sm ghost" title="Remove" onclick="kDelItem(${i})">✕</button>`:''}</div>`).join('')}${er.items?'<div class="err">Add at least one change.</div>':''}<button class="btn sm ghost" onclick="kAddItem()">+ Add another change</button></div>${msg('Message to university <span class="note">(optional)</span>')}<button class="btn pri" onclick="kDecide('${p.id}','Changes Requested')">Send change request</button>`;
 if(d==='R')body=`<div class="warn">Rejecting tells the university this programme was not approved. They can still edit and resubmit.</div>${msg('Reason <i>*</i>')}<button class="btn danger" onclick="kDecide('${p.id}','Rejected')">Reject programme</button>`;
 return `<div class="card kdec"><h3>Decision</h3><div class="chipset">${chips}</div>${body}${d?nextBox:''}<div class="f" style="margin-top:16px"><label>Internal notes <span class="note">(only MoHE sees these)</span></label><textarea rows="2" oninput="prog('${p.id}').kNotes=this.value">${esc(p.kNotes||'')}</textarea>${p.reviewedBy?`<div class="hint">Last reviewed by ${esc(p.reviewedBy)}, ${esc(p.reviewedAt||'')}</div>`:''}</div></div>`}
let kUndo=null;
function kUndoDo(){if(!kUndo)return;const u=kUndo;const p=prog(u.id);Object.keys(p).forEach(k=>delete p[k]);Object.assign(p,u.before);state.audit.splice(0,state.audit.length-u.aLen);state.notifs.splice(0,state.notifs.length-u.nLen);kUndo=null;kit={id:null,items:[],msg:'',dec:'',err:{}};toast('Decision undone');go('queue',u.id)}
function kDecide(id,st){if(!need('review','You don’t have access to decide on programmes'))return;const p=prog(id);const msg=(kit.id===id?kit.msg:'').trim();const items=kit.id===id?kit.items.filter(i=>i.text.trim()).map(i=>({id:uid(),sec:i.sec,fld:i.fld||'',text:i.text.trim(),done:false})):[];
 if(st==='Changes Requested'&&!items.length){kit.err={items:true};render();return}
 if(st==='Rejected'&&!msg){kit.err={msg:true};render();return}
 const nid=kq.next?kNextId(id):null;
 const before=JSON.parse(JSON.stringify(p)),aLen=state.audit.length,nLen=state.notifs.length;
 p.resub=null;p.reviewedBy=ME.K.user;p.reviewedAt=now();
 let tmsg;
 if(st==='Rejected'&&p.liveSnap){const L=JSON.parse(JSON.stringify(p.liveSnap));const keep={kNotes:p.kNotes,reviewedBy:p.reviewedBy,reviewedAt:p.reviewedAt,hist:p.hist,code:p.code};Object.keys(p).forEach(k=>delete p[k]);Object.assign(p,L,keep,{status:'Published',kptNote:'Your edit was not approved: '+msg+'. The previously approved version remains live.',kptItems:[],upd:Date.now()});addHist(p,ME.K.user,'Rejected the edit (live version kept)',msg);log(ME.K.user,`Rejected edit of “${p.name}” (live version kept)`,'Programme',`${p.uni}: edit to “${p.name}” not approved. Live version kept.`,p.uni);tmsg='Edit rejected. The live version stays online'}
 else{
  if(st==='Published')delete p.liveSnap;
  if(st==='Changes Requested')p.snap=snapOf(p);else delete p.snap;p.status=st;p.upd=Date.now();p.kptItems=st==='Changes Requested'?items:[];p.kptNote=st==='Published'?'':st==='Changes Requested'?kSummary(items,msg):msg;
  const verb={Published:'Approved & published',  'Changes Requested':'Requested changes on',Rejected:'Rejected'}[st];
  addHist(p,ME.K.user,{Published:'Approved and published','Changes Requested':'Requested changes',Rejected:'Rejected'}[st],st==='Changes Requested'?p.kptNote:msg);
  log(ME.K.user,`${verb} “${p.name}”`,'Programme',`${p.uni}: “${p.name}”, ${st}`,p.uni);
  tmsg=st==='Published'?'Approved. Now live on the public site':st==='Changes Requested'?'Change request sent':'Rejected'}
 kUndo={id,before,aLen,nLen};kit={id:null,items:[],msg:'',dec:'',err:{}};
 toast(tmsg,`${p.uni} notified`,{label:'Undo',fn:'kUndoDo()'});go('queue',nid||null)}
function kStd(m){m.innerHTML=topbar('Categories & Standards','Official category list and codes. Fix once here, applies everywhere.')+`<div class="card cats"><table><tr><th>Code</th><th>Category</th><th>Programmes</th><th></th></tr>${CATS.map((c,i)=>`<tr><td><input style="width:80px" id="cc${i}" value="${c[0]}"></td><td>${c[1]}</td><td>${state.programmes.filter(p=>p.cat===c[0]).length}</td><td><button class="btn sm ghost" onclick="saveCat(${i})">Save</button></td></tr>`).join('')}</table><div class="note" style="margin-top:10px">Changing a code updates every programme using it.</div></div><div class="card" style="margin-top:14px"><h3>Recent changes</h3>${state.audit.filter(a=>a.entity==='Standards').slice(0,8).map(a=>`<div style="padding:5px 0;border-top:1px solid var(--line)"><b>${esc(a.action)}</b> <span class="note">· ${esc(a.user)} · ${a.t}</span></div>`).join('')||'<div class="note">No changes yet.</div>'}</div>`}
function saveCat(i,ok){if(!need('config','Only a MoHE Super Admin can change standards'))return;const nv=$('#cc'+i).value.trim().toUpperCase();if(!nv)return;const old=CATS[i][0];if(nv===old){toast('No change');return}const n=state.programmes.filter(p=>p.cat===old).length;
 if(CATS.some((c,j)=>j!==i&&c[0]===nv)){toast('That code is already used');return}
 if(n&&!ok){modal(`<h3 style="margin-top:0">Change ${old} to ${esc(nv)}?</h3><div class="info" style="margin-top:0">This updates ${n} programme${n>1?'s':''} across universities straight away.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn pri" onclick="saveCat(${i},true)">Change it</button></div>`);return}
 closeM();state.programmes.forEach(p=>{if(p.cat===old)p.cat=nv});CATS[i][0]=nv;log(ME.K.user,`Changed category code ${old} → ${nv}`,'Standards','','MoHE');toast('Category code updated');render()}

(()=>{const a=state.apps.find(x=>x.name==='Kavya Nair');if(a){a.status='Withdrawn';a.wdAt=Date.now()-3*864e5;a.reason='The dates no longer suit me';a.tl.push(['Withdrawn by applicant: The dates no longer suit me','3 days ago'])}})();
render();
</script>
